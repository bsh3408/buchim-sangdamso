<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>붙임상담소</title>
<link rel="stylesheet" href="./shared/chalkboard.css" />
</head>
<body>
<div id="app">
  <header>
    <div class="logo" onclick="goHome()"><span>🧷</span>붙임상담소</div>
    <div class="header-actions">
      <button class="back-btn" id="backBtn" onclick="goBack()" style="display:none;">&larr; 뒤로</button>
      <button class="teacher-btn" id="teacherBtn" onclick="startTeacher()">🎓 선생님이신가요</button>
    </div>
  </header>
  <main id="main"></main>
</div>
<div id="modalRoot"></div>

<script type="module">
import { db } from './shared/db.js';
import { escapeHtml } from './shared/escape.js';
import { buildPresetSlots, buildCustomSlots, buildAfterschoolSlots } from './shared/timetable-presets.js';
import { renderParentSlotGrid, peelPostit, groupByPeriod } from './shared/chalkboard.js';
import { renderCalendar } from './shared/calendar.js';

/*****************************************************
 * 공용 유틸
 *****************************************************/
const PURPOSES = ['생활태도', '인성', '학업성취 및 성적', '진로진학', '특기적성', '교우관계'];
const MODE_LABEL = { phone: '전화', in_person: '방문' };
const SCHOOL_LEVEL_SUFFIX = { elementary: '초등학교', middle: '중학교', high: '고등학교' };
const SCHOOL_LEVEL_TO_PRESET = { elementary: 'elementary', middle: 'middle', high: 'high' };

function gradeClassLabel(grade, teacherClass) {
  return `${escapeHtml(String(grade ?? ''))}학년 ${escapeHtml(String(teacherClass ?? ''))}반`;
}
function plainGradeClass(grade, teacherClass) {
  return `${grade ?? ''}학년 ${teacherClass ?? ''}반`;
}
function periodDisplay(slot) {
  if (slot.period_label) return ` (${escapeHtml(slot.period_label)})`;
  if (slot.period) return ` (${slot.period}교시)`;
  return '';
}

function $(sel, parent) { return (parent || document).querySelector(sel); }
function $$(sel, parent) { return Array.from((parent || document).querySelectorAll(sel)); }
function el(html) { const d = document.createElement('div'); d.innerHTML = html.trim(); return d.firstChild; }
function toast(msg, ms) {
  const t = el(`<div class="toast">${escapeHtml(msg)}</div>`);
  document.body.appendChild(t);
  setTimeout(() => t.remove(), ms || 2400);
}
function closeModal() { document.getElementById('modalRoot').innerHTML = ''; }
function addMinutes(hhmm, minutes) {
  const [h, m] = hhmm.split(':').map(Number);
  const total = h * 60 + m + minutes;
  const hh = String(Math.floor(total / 60) % 24).padStart(2, '0');
  const mm = String(total % 60).padStart(2, '0');
  return `${hh}:${mm}`;
}
function formatLocalDate(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}
function dowLabel(dateStr) {
  const [y, m, d] = dateStr.split('-').map(Number);
  return ['일', '월', '화', '수', '목', '금', '토'][new Date(y, m - 1, d).getDay()];
}

/*****************************************************
 * 화면 스택
 *****************************************************/
let viewStack = [];
let currentView = null;

function setView(name, render, noPush) {
  if (!noPush && currentView) viewStack.push(currentView);
  currentView = { name, render };
  $('#backBtn').style.display = viewStack.length > 0 ? 'inline-flex' : 'none';
  render();
  window.scrollTo(0, 0);
}
function goBack() {
  if (viewStack.length === 0) return;
  currentView = viewStack.pop();
  $('#backBtn').style.display = viewStack.length > 0 ? 'inline-flex' : 'none';
  currentView.render();
  window.scrollTo(0, 0);
}
function goHome() {
  viewStack = [];
  parentState = { parentCode: null, pageData: null, selectedDate: null };
  renderHome();
}

/*****************************************************
 * 홈 화면
 *****************************************************/
function renderHome() {
  setView('home', () => {
    $('#main').innerHTML = `
      <div class="home-title">
        <h1>🧷 붙임상담소</h1>
        <p>칠판에 포스트잇 붙이듯, 학부모 상담을 예약해요</p>
      </div>
      <div class="home-choices">
        <div class="home-choice" onclick="startParent()">
          <div class="icon">👨‍👩‍👧</div>
          <div class="txt">
            <strong>상담 예약하기</strong>
            <span>선생님이 알려주신 코드로 예약해요</span>
          </div>
        </div>
      </div>
    `;
  }, true);
}

/*****************************************************
 * 학부모 플로우
 *****************************************************/
let parentState = { parentCode: null, pageData: null, selectedDate: null };

function startParent() {
  setView('parent-enter', () => {
    $('#main').innerHTML = `
      <div class="card">
        <h2>선생님이 알려주신 코드를 입력해주세요</h2>
        <div class="field">
          <input type="text" id="pc-code" maxlength="10" placeholder="예: A3F9K2"
                 style="text-align:center; letter-spacing:2px; text-transform:uppercase; font-size:16px;">
        </div>
        <button class="btn btn-primary btn-block" id="pc-submit">신청하러 가기</button>
      </div>
    `;
    $('#pc-code').focus();
    $('#pc-code').addEventListener('keypress', e => { if (e.key === 'Enter') submitParentCode(); });
    $('#pc-submit').addEventListener('click', submitParentCode);
  });
}

async function submitParentCode() {
  const code = $('#pc-code').value.trim().toUpperCase();
  if (!code) return toast('코드를 입력해주세요');
  const btn = $('#pc-submit');
  btn.disabled = true; btn.textContent = '확인 중...';
  try {
    await loadParentSchedule(code);
    renderParentTimetableView();
  } catch (err) {
    btn.disabled = false; btn.textContent = '신청하러 가기';
    toast(err.message);
  }
}

async function loadParentSchedule(parentCode) {
  const data = await db.getPublicSchedule(parentCode);
  parentState.parentCode = parentCode;
  parentState.pageData = data;
  parentState.selectedDate = data.dates[0]?.date ?? null;
  history.replaceState(null, '', `${location.pathname}?code=${encodeURIComponent(parentCode)}`);
}

function renderParentTimetableView() {
  const data = parentState.pageData;
  setView('parent-timetable', () => {
    $('#main').innerHTML = `
      <div class="card">
        <h2>${gradeClassLabel(data.grade, data.teacher_class)} · ${escapeHtml(data.teacher_name)} 선생님</h2>
        <p class="subtitle">상담 신청 시간표예요</p>

        ${data.dates.length === 0 ? '<div class="empty-state"><div class="big">📭</div><p>현재 열려있는 상담 가능 시간이 없어요.</p></div>' : `
          <h3>날짜</h3>
          <div class="date-scroll" id="pt-dateScroll"></div>
          <div class="legend">
            <div class="legend-item"><div class="legend-box available"></div>예약 가능</div>
            <div class="legend-item"><div class="legend-box booked"></div>예약됨 (눌러서 취소)</div>
          </div>
          <div class="cb-wrap" id="pt-timetable"></div>
        `}
      </div>
    `;
    if (data.dates.length > 0) {
      renderParentDateScroll();
      renderParentTimetableBody();
    }
  });
}

function renderParentDateScroll() {
  const scroll = $('#pt-dateScroll');
  scroll.innerHTML = parentState.pageData.dates.map(d => `
    <div class="date-chip ${d.date === parentState.selectedDate ? 'selected' : ''}" data-date="${d.date}">
      <div class="dow">${d.date.slice(5)} (${dowLabel(d.date)})</div>
      <div class="dd">${Number(d.date.slice(8, 10))}</div>
    </div>
  `).join('');
  $$('.date-chip', scroll).forEach(chip => {
    chip.addEventListener('click', () => {
      parentState.selectedDate = chip.dataset.date;
      renderParentDateScroll();
      renderParentTimetableBody();
    });
  });
}

function renderParentTimetableBody() {
  const area = $('#pt-timetable');
  const dateEntry = parentState.pageData.dates.find(d => d.date === parentState.selectedDate);
  area.innerHTML = `<div class="cb-title" style="color:var(--chalk);opacity:.85;font-size:13px;margin-bottom:14px;">${dateEntry.date}</div>`;
  for (const group of groupByPeriod(dateEntry.slots)) {
    const block = el(`<div class="period-group"></div>`);
    if (group.period_label) {
      block.innerHTML = `<div class="period-label"><strong style="color:var(--chalk);">${escapeHtml(group.period_label)}</strong></div>`;
    } else if (group.period) {
      block.innerHTML = `<div class="period-label"><strong style="color:var(--chalk);">${group.period}교시</strong><span style="color:var(--chalk-dim);">${group.period_range}</span></div>`;
    }
    const grid = document.createElement('div');
    block.appendChild(grid);
    area.appendChild(block);
    renderParentSlotGrid(grid, group.slots, {
      onEmptyClick: (slot) => openBookingModal(slot, dateEntry),
      onFilledClick: (slot, slotEl) => openCancelModal(slot, dateEntry, slotEl),
    });
  }
}

/*****************************************************
 * 예약 / 취소 모달
 *****************************************************/
function openBookingModal(slot, dateEntry) {
  const page = parentState.pageData;
  const endTime = addMinutes(slot.start_time.slice(0, 5), dateEntry.duration_minutes || 20);
  const periodText = periodDisplay(slot);
  const allowedModes = slot.mode === 'both' ? ['in_person', 'phone'] : [slot.mode];

  const methodChoices = allowedModes.map(m =>
    `<div class="choice" data-method="${m}">${m === 'in_person' ? '🏫 방문' : '📞 전화'}</div>`
  ).join('');
  const purposeChoices = PURPOSES.map(p => `<div class="choice" data-purpose="${escapeHtml(p)}">${escapeHtml(p)}</div>`).join('');

  const bg = el(`
    <div class="modal-bg" id="bookBg">
      <div class="modal">
        <div class="modal-header">
          <h2>상담 예약</h2>
          <button class="modal-close" id="bookClose">✕</button>
        </div>
        <div class="booking-summary">
          <strong>${gradeClassLabel(page.grade, page.teacher_class)}</strong><br>
          ${dateEntry.date}${periodText} ${slot.start_time.slice(0, 5)} ~ ${endTime}
        </div>
        <div class="field">
          <label>학생 번호 <span class="req">*</span></label>
          <input type="number" id="bk-num" min="1" max="50" placeholder="예: 12">
        </div>
        <div class="field">
          <label>학생 이름 <span class="req">*</span></label>
          <input type="text" id="bk-sname" placeholder="예: 홍길동">
        </div>
        <div class="row">
          <div class="field">
            <label>학부모 성함 <span class="req">*</span></label>
            <input type="text" id="bk-pname" placeholder="예: 홍길동 학부모">
          </div>
          <div class="field">
            <label>학부모 연락처 <span class="req">*</span></label>
            <input type="tel" id="bk-pphone" placeholder="010-0000-0000">
          </div>
        </div>
        <div class="hint" style="margin-bottom:14px;">🔐 취소할 때는 여기 입력한 학부모 연락처로 본인 확인을 해요. 꼭 정확히 입력해주세요.</div>
        <div class="field">
          <label>상담 방법 <span class="req">*</span></label>
          <div class="choice-group" id="method-group">${methodChoices}</div>
          <div class="hint">선생님이 이 시간에 가능한 방법만 선택할 수 있어요</div>
        </div>
        <div class="field">
          <label>상담 목적 <span class="req">*</span> <span style="font-weight:400;color:var(--text-muted);font-size:12px;">(중복 선택 가능)</span></label>
          <div class="choice-group" id="purpose-group">${purposeChoices}</div>
        </div>
        <div class="field">
          <label>상담 내용 (선택)</label>
          <textarea id="bk-content" placeholder="선생님께 묻고 싶은 질문이나 미리 알려드릴 내용을 적어주세요"></textarea>
        </div>
        <div class="field" style="margin-top:20px;">
          <button class="btn btn-primary btn-block btn-lg" id="bk-submit">예약 신청하기</button>
        </div>
      </div>
    </div>
  `);
  document.getElementById('modalRoot').appendChild(bg);

  bg.addEventListener('click', (e) => { if (e.target === bg) closeModal(); });
  $('#bookClose', bg).addEventListener('click', closeModal);

  if (allowedModes.length === 1) $(`.choice[data-method]`, bg).classList.add('selected');
  $$('#method-group .choice', bg).forEach(c => {
    c.addEventListener('click', () => {
      $$('#method-group .choice', bg).forEach(x => x.classList.remove('selected'));
      c.classList.add('selected');
    });
  });
  $$('#purpose-group .choice', bg).forEach(c => {
    c.addEventListener('click', () => c.classList.toggle('selected'));
  });

  $('#bk-submit', bg).addEventListener('click', () => submitBooking(slot, dateEntry, bg));
}

async function submitBooking(slot, dateEntry, bg) {
  const num = $('#bk-num', bg).value.trim();
  const sname = $('#bk-sname', bg).value.trim();
  const pname = $('#bk-pname', bg).value.trim();
  const pphone = $('#bk-pphone', bg).value.trim();
  const methodEl = $('#method-group .choice.selected', bg);
  const method = methodEl ? methodEl.dataset.method : '';
  const purposes = $$('#purpose-group .choice.selected', bg).map(x => x.dataset.purpose);
  const content = $('#bk-content', bg).value.trim();

  if (!num) return toast('학생 번호를 입력해주세요');
  if (!sname) return toast('학생 이름을 입력해주세요');
  if (!pname) return toast('학부모 성함을 입력해주세요');
  if (!pphone) return toast('학부모 연락처를 입력해주세요');
  if (!method) return toast('상담 방법을 선택해주세요');
  if (purposes.length === 0) return toast('상담 목적을 1개 이상 선택해주세요');

  const btn = $('#bk-submit', bg);
  btn.disabled = true; btn.textContent = '예약 중...';

  try {
    const page = parentState.pageData;
    const className = plainGradeClass(page.grade, page.teacher_class);
    const cancelToken = await db.bookSlot(
      parentState.parentCode, slot.slot_id,
      num, sname, className, pname, pphone, purposes, content, method
    );
    slot.occupied = true;
    slot.booking_ref = { student_number: num, cancel_token: cancelToken };
    closeModal();
    showBookingSuccess(slot, dateEntry, sname, method);
  } catch (err) {
    btn.disabled = false; btn.textContent = '예약 신청하기';
    if (err.message === 'ALREADY_BOOKED') toast('방금 다른 분이 신청했어요. 새로고침해서 다른 시간을 골라주세요.');
    else toast(err.message);
  }
}

function showBookingSuccess(slot, dateEntry, studentName, method) {
  setView('parent-done', () => {
    const page = parentState.pageData;
    const periodText = periodDisplay(slot);
    $('#main').innerHTML = `
      <div class="card" style="text-align:center;padding:36px 22px;">
        <div style="font-size:56px;margin-bottom:14px;">✅</div>
        <h1 style="font-size:20px;">예약이 완료되었어요!</h1>
        <p class="subtitle">선생님께 신청 내용이 전달됩니다</p>
        <div style="background:var(--primary-soft);padding:16px;border-radius:12px;text-align:left;margin:16px 0;">
          <div style="margin-bottom:6px;"><strong>선생님</strong> · ${gradeClassLabel(page.grade, page.teacher_class)} ${escapeHtml(page.teacher_name)}</div>
          <div style="margin-bottom:6px;"><strong>학생</strong> · ${escapeHtml(studentName)}</div>
          <div style="margin-bottom:6px;"><strong>일시</strong> · ${dateEntry.date}${periodText} ${slot.start_time.slice(0, 5)}</div>
          <div><strong>상담 방법</strong> · ${MODE_LABEL[method]}</div>
        </div>
        <div class="info-box">
          <span class="ico">🔐</span>
          <div>예약을 취소하려면, 시간표에서 본인이 예약한 포스트잇 칸을 다시 눌러 <strong>예약할 때 입력한 학부모 연락처</strong>를 입력하시면 됩니다.</div>
        </div>
        <button class="btn btn-primary btn-block" onclick="goHome()">홈으로 돌아가기</button>
        <button class="btn btn-ghost btn-block" style="margin-top:8px;" id="pd-back">이 시간표로 돌아가기</button>
      </div>
    `;
    $('#pd-back').addEventListener('click', goBack);
  });
}

function openCancelModal(slot, dateEntry, slotEl) {
  const ref = slot.booking_ref;
  if (!ref?.cancel_token) return toast('이 예약은 취소 정보를 불러올 수 없습니다.');
  const periodText = periodDisplay(slot);
  const page = parentState.pageData;

  const bg = el(`
    <div class="modal-bg" id="cancelBg">
      <div class="modal">
        <div class="modal-header">
          <h2>예약 취소</h2>
          <button class="modal-close" id="cancelClose">✕</button>
        </div>
        <div class="booking-summary">
          <strong>${gradeClassLabel(page.grade, page.teacher_class)}</strong><br>
          ${dateEntry.date}${periodText} ${slot.start_time.slice(0, 5)}
        </div>
        <div class="info-box danger">
          <span class="ico">⚠️</span>
          <div>본인이 예약한 내용이 맞다면, 예약할 때 입력한 <strong>학부모 연락처</strong>를 입력하고 취소해주세요.</div>
        </div>
        <div class="field">
          <label>학부모 연락처 <span class="req">*</span></label>
          <input type="tel" id="cx-phone" placeholder="예약할 때 입력한 연락처">
        </div>
        <div style="display:flex;gap:8px;margin-top:16px;">
          <button class="btn btn-ghost" style="flex:1;" id="cx-close">닫기</button>
          <button class="btn btn-danger" style="flex:1;" id="cx-submit">예약 취소하기</button>
        </div>
      </div>
    </div>
  `);
  document.getElementById('modalRoot').appendChild(bg);
  bg.addEventListener('click', (e) => { if (e.target === bg) closeModal(); });
  $('#cancelClose', bg).addEventListener('click', closeModal);
  $('#cx-close', bg).addEventListener('click', closeModal);
  setTimeout(() => $('#cx-phone', bg).focus(), 100);
  $('#cx-phone', bg).addEventListener('keypress', e => { if (e.key === 'Enter') doCancelBooking(slot, slotEl, bg); });
  $('#cx-submit', bg).addEventListener('click', () => doCancelBooking(slot, slotEl, bg));
}

async function doCancelBooking(slot, slotEl, bg) {
  const phone = $('#cx-phone', bg).value.trim();
  if (!phone) return toast('학부모 연락처를 입력해주세요');
  const btn = $('#cx-submit', bg);
  btn.disabled = true; btn.textContent = '처리 중...';
  try {
    await db.cancelBooking(slot.booking_ref.cancel_token, phone);
    closeModal();
    toast('예약이 취소되었습니다');
    slot.occupied = false;
    slot.booking_ref = null;
    peelPostit(slotEl, () => renderParentTimetableBody());
  } catch (err) {
    btn.disabled = false; btn.textContent = '예약 취소하기';
    toast(err.message);
  }
}

/*****************************************************
 * 담임 플로우
 *****************************************************/
const WEEKDAY_LABELS = [null, '월', '화', '수', '목', '금'];

let teacherState = {
  pageId: null, adminCode: null, teacherName: '', school: '', schoolLevel: '', grade: '', teacherClass: '',
  parentCode: null,
  dates: new Map(), // date -> 서버에서 불러온 실제 슬롯(예약 포함)
  selectedDates: new Set(), // 달력에서 고른 날짜(저장 대상)
  periodPattern: null, // { preset, duration_minutes, slots:[...] } 교시 시간 틀(모든 요일 공통)
  weekdayOpen: { 1: {}, 2: {}, 3: {}, 4: {}, 5: {} }, // weekdayOpen[요일][교시] = { is_open, mode }
};

function startTeacher() {
  setView('teacher-choice', () => {
    $('#main').innerHTML = `
      <div class="home-title">
        <h1 style="font-size:20px;">🎓 선생님이신가요?</h1>
      </div>
      <div class="home-choices">
        <div class="home-choice" id="tc-login">
          <div class="icon">🔑</div>
          <div class="txt"><strong>로그인</strong><span>이미 등록했어요</span></div>
        </div>
        <div class="home-choice" id="tc-register">
          <div class="icon">🆕</div>
          <div class="txt"><strong>아이디 등록</strong><span>처음 사용해요</span></div>
        </div>
      </div>
    `;
    $('#tc-login').addEventListener('click', startTeacherLogin);
    $('#tc-register').addEventListener('click', startTeacherRegister);
  });
}

function startTeacherLogin() {
  setView('teacher-login', () => {
    $('#main').innerHTML = `
      <div class="card">
        <h2>🔑 로그인</h2>
        <p class="subtitle">등록할 때 입력한 이름과 코드를 입력해주세요.</p>
        <div class="field"><label>이름</label><input type="text" id="tl-name" placeholder="예: 김민준"></div>

async function loadTeacherSchedule() {
  const data = await db.getTeacherSchedule(teacherState.pageId, teacherState.adminCode);
  teacherState.teacherName = data.teacher_name;
  teacherState.parentCode = data.parent_code;
  teacherState.dates = new Map(data.dates.map(d => [d.date, {
    ...d,
    slots: d.slots.map(s => ({ ...s, start_time: s.start_time.slice(0, 5) })),
  }]));
  teacherState.selectedDates = new Set(teacherState.dates.keys());
  derivePatternFromDates();
}

/** 서버에 저장된 날짜들의 시간 구조·요일별 열림 상태를 편집용 틀(periodPattern/weekdayOpen)로 되살린다. */
function derivePatternFromDates() {
  const entries = [...teacherState.dates.values()];
  if (entries.length === 0) {
    if (!teacherState.periodPattern) {
      teacherState.periodPattern = {};
      generateDefaultSlots(teacherState.periodPattern);
    }
    teacherState.weekdayOpen = { 1: {}, 2: {}, 3: {}, 4: {}, 5: {} };
    return;
  }

  // periodPattern.slots는 순전히 "교시 시간 구조"만 나타낸다. 실제 열림·방법 상태는 전부
  // weekdayOpen 쪽 명시적인 값으로만 판단하므로, 여기서는 항상 닫힘을 기본값으로 둔다
  // (그렇지 않으면 기준으로 삼은 날짜의 요일 상태가 다른 모든 요일의 기본값으로 새어나간다).
  const base = entries[0];
  teacherState.periodPattern = {
    preset: base.preset,
    duration_minutes: base.duration_minutes,
    slots: base.slots.map(({ start_time, period, period_range, period_label }) =>
      ({ start_time, period, period_range, period_label, is_open: false, mode: 'both' })),
  };

  const weekdayOpen = { 1: {}, 2: {}, 3: {}, 4: {}, 5: {} };
  for (const entry of entries) {
    const wd = new Date(entry.date + 'T00:00:00').getDay();
    if (wd < 1 || wd > 5) continue;
    for (const group of groupByPeriod(entry.slots)) {
      const key = group.period ?? (group.period_label ?? 'custom');
      weekdayOpen[wd][key] = summarizeGroupState(group.slots);
    }
  }
  teacherState.weekdayOpen = weekdayOpen;
}

/** 한 교시(여러 상담 슬롯)의 열림·방법 상태를 하나로 요약한다. */
function summarizeGroupState(slots) {
  const isOpen = slots.some(s => s.is_open);
  const modes = new Set();
  slots.forEach(s => {
    if (!s.is_open) return;
    if (s.mode === 'both') { modes.add('in_person'); modes.add('phone'); }
    else if (s.mode) modes.add(s.mode);
  });
  const mode = modes.size === 2 ? 'both' : modes.size === 1 ? [...modes][0] : 'both';
  return { is_open: isOpen, mode };
}

/** 특정 요일·교시 칸에 실제 예약이 있는지 본다(요일별 시간표 칸 잠금용). */
function isWeekdayPeriodBooked(weekday, periodKey) {
  for (const [date, entry] of teacherState.dates) {
    if (new Date(date + 'T00:00:00').getDay() !== weekday) continue;
    for (const s of entry.slots) {
      if ((s.period ?? s.period_label) === periodKey && s.booking) return true;
    }
  }
  return false;
}

/** weekdayOpen에 저장된 값이 있으면 그걸, 없으면 patternPattern 자체의 기본 상태를 돌려준다. */
function getEffectiveState(weekday, periodKey, baseSlots) {
  const override = teacherState.weekdayOpen[weekday]?.[periodKey];
  if (override) return override;
  return summarizeGroupState(baseSlots);
}

function toggleWeekdayOpen(weekday, key, baseSlots) {
  const cur = getEffectiveState(weekday, key, baseSlots);
  teacherState.weekdayOpen[weekday][key] = cur.is_open
    ? { is_open: false, mode: cur.mode }
    : { is_open: true, mode: cur.mode || 'both' };
  renderPatternGrid();
}

function toggleWeekdayMethod(weekday, key, method, baseSlots) {
  const cur = getEffectiveState(weekday, key, baseSlots);
  const modes = new Set(cur.mode === 'both' ? ['in_person', 'phone'] : cur.mode ? [cur.mode] : []);
  if (modes.has(method)) modes.delete(method); else modes.add(method);
  const isOpen = modes.size > 0;
  const mode = modes.size === 2 ? 'both' : modes.size === 1 ? [...modes][0] : (cur.mode || 'both');
  teacherState.weekdayOpen[weekday][key] = { is_open: isOpen, mode };
  renderPatternGrid();
}

/** 달력에서 고른 날짜들을 요일별로 센다. 예: {1: 3, 3: 2} = 월요일 3개, 수요일 2개. */
function countSelectedByWeekday() {
  const counts = {};
  for (const d of teacherState.selectedDates) {
    const wd = new Date(d + 'T00:00:00').getDay();
    counts[wd] = (counts[wd] || 0) + 1;
  }
  return counts;
}

function renderPatternGrid() {
  const pattern = teacherState.periodPattern;
  const container = $('#weekdayGrid');
  const groups = groupByPeriod(pattern.slots);
  if (groups.length === 0) { container.innerHTML = '<p class="hint">먼저 위에서 시간표를 만들어주세요.</p>'; return; }

  const weekdayCounts = countSelectedByWeekday();
  const activeWeekdays = [1, 2, 3, 4, 5].filter(w => weekdayCounts[w]);
  if (activeWeekdays.length === 0) {
    container.innerHTML = '<p class="hint">먼저 위 달력에서 날짜를 골라주세요. 고른 날짜의 요일만 여기 시간표에 나타나요.</p>';
    return;
  }

  let html = '<div class="wd-grid-wrap"><table class="wd-grid"><thead><tr><th></th>' +
    activeWeekdays.map(w => `<th>${WEEKDAY_LABELS[w]}<br><span class="wd-col-count">${weekdayCounts[w]}일</span></th>`).join('') + '</tr></thead><tbody>';

  for (const group of groups) {
    const key = group.period ?? (group.period_label ?? 'custom');
    const headLabel = group.period_label || (group.period ? `${group.period}교시` : '직접 설정');
    const start = group.slots[0].start_time.slice(0, 5);
    const lastSlot = group.slots[group.slots.length - 1];
    const end = addMinutes(lastSlot.start_time.slice(0, 5), pattern.duration_minutes || 20);
    const range = group.period_range || `${start}~${end}`;
    html += `<tr><th class="wd-row-head">${escapeHtml(headLabel)}<br><span class="wd-row-time">${range}</span></th>`;
    for (const w of activeWeekdays) {
      const booked = isWeekdayPeriodBooked(w, key);
      const state = getEffectiveState(w, key, group.slots);
      const cls = ['wd-cell'];
      if (booked) cls.push('wd-cell--booked');
      else if (state.is_open) cls.push('wd-cell--open');
      html += `<td class="${cls.join(' ')}" data-weekday="${w}" data-key="${key}">`;
      if (booked) {
        html += `<span class="wd-cell-label">예약됨</span>`;
      } else if (state.is_open) {
        const modes = state.mode === 'both' ? ['in_person', 'phone'] : [state.mode];
        html += modes.map(m => `<span class="wd-method-tag ${m === 'phone' ? 'm-phone' : 'm-visit'}" data-m="${m}">${m === 'phone' ? '전화' : '방문'}</span>`).join('');
      } else {
        html += `<span class="wd-cell-label">닫힘</span>`;
      }
      html += `</td>`;
    }
    html += '</tr>';
  }
  html += '</tbody></table></div>';
  container.innerHTML = html;

  $$('.wd-cell:not(.wd-cell--booked)', container).forEach(cell => {
    const weekday = Number(cell.dataset.weekday);
    const rawKey = cell.dataset.key;
    const key = /^\d+$/.test(rawKey) ? Number(rawKey) : rawKey;
    const group = groups.find(g => (g.period ?? (g.period_label ?? 'custom')) === key);
    cell.addEventListener('click', (e) => {
      const methodTag = e.target.closest('.wd-method-tag');
      if (methodTag) {
        e.stopPropagation();
        toggleWeekdayMethod(weekday, key, methodTag.dataset.m, group.slots);
      } else {
        toggleWeekdayOpen(weekday, key, group.slots);
      }
    });
  });
}

async function saveAvailability() {
  const pattern = teacherState.periodPattern;
  const selected = [...teacherState.selectedDates];
  if (selected.length === 0) return toast('먼저 달력에서 날짜를 골라주세요');
  const groups = groupByPeriod(pattern.slots);
  try {
    for (const d of selected) {
      const weekday = new Date(d + 'T00:00:00').getDay();
      const slotsForDate = groups.flatMap(group => {
        const key = group.period ?? (group.period_label ?? 'custom');
        const state = getEffectiveState(weekday, key, group.slots);
        return group.slots.map(({ start_time, period, period_range, period_label }) => ({
          start_time, period, period_range, period_label,
          is_open: state.is_open, mode: state.mode,
        }));
      });
      await db.saveDateSlots(teacherState.pageId, teacherState.adminCode, d, pattern.preset, pattern.duration_minutes, slotsForDate);
    }
    await loadTeacherSchedule();
    renderAvailabilityEditor();
    toast(`${selected.length}개 날짜에 저장했어요`);
    await maybePublish();
  } catch (err) {
    toast(err.message);
  }
}

async function maybePublish() {
  if (teacherState.parentCode) return;
  try {
    const code = await db.publishPage(teacherState.pageId, teacherState.adminCode);
    teacherState.parentCode = code;
    toast(`학부모 공유 코드가 만들어졌어요: ${code}`);
  } catch (err) { /* 다음 저장 때 다시 시도 */ }
}

function openBookingsList() {
  setView('teacher-bookings', () => {
    $('#main').innerHTML = `<div class="loading"><div class="spinner"></div>예약 현황 로드 중...</div>`;
    loadTeacherSchedule().then(renderBookingsList).catch(err => {
      $('#main').innerHTML = `<div class="card"><p>${escapeHtml(err.message)}</p></div>`;
    });
  });
}

function renderBookingsList() {
  const today = formatLocalDate(new Date());
  const bookings = [];
  for (const [date, entry] of teacherState.dates) {
    for (const s of entry.slots) {
      if (s.booking) bookings.push({ date, slot_id: s.slot_id, start_time: s.start_time, ...s.booking });
    }
  }
  bookings.sort((a, b) => (a.date !== b.date ? (a.date < b.date ? -1 : 1) : a.start_time.localeCompare(b.start_time)));
  const upcoming = bookings.filter(b => b.date >= today);
  const past = bookings.filter(b => b.date < today);

  const renderOne = b => `
    <div class="booking-item">
      <div class="booking-item-head">
        <div>
          <div class="booking-item-title">${escapeHtml(b.student_number)}번 ${escapeHtml(b.student_name)}</div>
          <div class="booking-item-time">📅 ${b.date} · ${b.start_time}</div>
        </div>
        <button class="btn btn-danger" style="padding:6px 10px;font-size:12px;" data-slot="${b.slot_id}" data-name="${escapeHtml(b.student_name)}">취소</button>
      </div>
      <div class="booking-item-meta"><strong>학부모</strong> ${escapeHtml(b.parent_name)} · ${escapeHtml(b.parent_phone)}</div>
      <div>${b.mode === 'phone' ? '<span class="tag method-phone">📞 전화</span>' : '<span class="tag method-visit">🏫 방문</span>'}${(b.topics || []).map(t => `<span class="tag">${escapeHtml(t)}</span>`).join('')}</div>
      ${b.notes ? `<div style="background:var(--disabled);padding:10px;border-radius:8px;font-size:13px;margin-top:6px;white-space:pre-wrap;">${escapeHtml(b.notes)}</div>` : ''}
    </div>
  `;

  $('#main').innerHTML = `
    <div class="card">
      <h2>📅 예약 현황</h2>
      <p class="subtitle">총 ${bookings.length}건 (다가오는 예약 ${upcoming.length}건)</p>
      <h3 style="margin-top:10px;">🔵 다가오는 예약</h3>
      ${upcoming.length === 0 ? '<div class="empty-state" style="padding:24px;"><p>예약된 상담이 없습니다</p></div>' : upcoming.map(renderOne).join('')}
      ${past.length > 0 ? `<h3 style="margin-top:22px;color:var(--text-muted);">📁 지난 예약 (${past.length})</h3>${past.map(renderOne).join('')}` : ''}
    </div>
  `;
  $$('#main button[data-slot]').forEach(btn => {
    btn.addEventListener('click', () => teacherCancelBk(btn.dataset.slot, btn.dataset.name));
  });
}

async function teacherCancelBk(slotId, studentName) {
  if (!confirm(`${studentName} 학생의 예약을 취소하시겠습니까?`)) return;
  try {
    await db.teacherCancelBooking(teacherState.pageId, teacherState.adminCode, slotId);
    await loadTeacherSchedule();
    toast('취소되었습니다');
    renderBookingsList();
  } catch (err) { toast(err.message); }
}

/*****************************************************
 * 초기화
 *****************************************************/
window.goHome = goHome;
window.goBack = goBack;
window.startParent = startParent;
window.startTeacher = startTeacher;
window.openAvailabilityEditor = openAvailabilityEditor;
window.openBookingsList = openBookingsList;

(function init() {
  const params = new URLSearchParams(location.search);
  const code = params.get('code');
  if (code) {
    $('#main').innerHTML = `<div class="loading"><div class="spinner"></div>시간표 로드 중...</div>`;
    loadParentSchedule(code).then(renderParentTimetableView).catch(err => {
      toast(err.message);
      renderHome();
    });
  } else {
    renderHome();
  }
})();
</script>
</body>
</html>
