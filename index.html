<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>우리지금만나</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<link rel="stylesheet" href="./shared/chalkboard.css" />
</head>
<body>
<div id="app">
  <header>
    <div class="logo" onclick="goHome()"><img src="./images/hands-icon.png" alt="" class="logo-icon">우리지금만나</div>
    <div class="header-actions">
      <button class="back-btn" id="backBtn" onclick="goBack()" style="display:none;">&larr; 뒤로</button>
      <button class="teacher-btn" id="teacherBtn" onclick="startTeacher()">선생님이신가요</button>
    </div>
  </header>
  <main id="main"></main>
</div>
<div id="modalRoot"></div>

<script type="module">
import { db } from './shared/db.js';
import { escapeHtml } from './shared/escape.js';
import { buildPresetSlots, buildCustomSlots, buildAfterschoolSlots } from './shared/timetable-presets.js';
import { renderParentSlotGrid, peelPostit, groupByPeriod } from './shared/chalkboard.js';
import { renderCalendar, renderParentCalendar } from './shared/calendar.js';

/*****************************************************
 * 공용 유틸
 *****************************************************/
const PURPOSES = ['생활태도', '인성', '학업성취 및 성적', '진로진학', '특기적성', '교우관계'];
const MODE_LABEL = { phone: '전화', in_person: '방문' };
const SCHOOL_LEVEL_SUFFIX = { elementary: '초등학교', middle: '중학교', high: '고등학교' };
const SCHOOL_LEVEL_TO_PRESET = { elementary: 'elementary', middle: 'middle', high: 'high' };
const DOW_KEYS = [1, 2, 3, 4, 5]; // JS Date#getDay() 기준 월=1 ~ 금=5

function gradeClassLabel(grade, teacherClass) {
  return `${escapeHtml(String(grade ?? ''))}학년 ${escapeHtml(String(teacherClass ?? ''))}반`;
}
function plainGradeClass(grade, teacherClass) {
  return `${grade ?? ''}학년 ${teacherClass ?? ''}반`;
}
function periodDisplay(slot) {
  if (slot.period_label) return ` (${escapeHtml(slot.period_label)})`;
  if (slot.period) return ` (${slot.period}교시)`;
  return '';
}

function $(sel, parent) { return (parent || document).querySelector(sel); }
function $$(sel, parent) { return Array.from((parent || document).querySelectorAll(sel)); }
function el(html) { const d = document.createElement('div'); d.innerHTML = html.trim(); return d.firstChild; }
function toast(msg, ms) {
  const t = el(`<div class="toast">${escapeHtml(msg)}</div>`);
  document.body.appendChild(t);
  setTimeout(() => t.remove(), ms || 2400);
}
function closeModal() { document.getElementById('modalRoot').innerHTML = ''; }
/** 되돌리기 어려운 동작(예약 신청·취소)은 버튼을 두 번 눌러야 실행되게 한다. 처음
 * 누르면 문구가 "정말 ~할까요?"로 바뀌며 살짝 두근거리고, 그 상태에서 다시 누르면
 * 실제로 fn()이 실행된다. 4초 안에 다시 안 누르면 원래 문구로 되돌아간다. */
function armConfirm(btn, confirmLabel, fn) {
  if (btn.dataset.armed === '1') {
    delete btn.dataset.armed;
    clearTimeout(Number(btn.dataset.armTimer));
    btn.classList.remove('btn-confirm-armed');
    fn();
    return;
  }
  btn.dataset.armed = '1';
  btn.dataset.originalLabel = btn.textContent;
  btn.textContent = confirmLabel;
  btn.classList.add('btn-confirm-armed');
  const timer = setTimeout(() => {
    if (btn.dataset.armed === '1') {
      delete btn.dataset.armed;
      btn.textContent = btn.dataset.originalLabel;
      btn.classList.remove('btn-confirm-armed');
    }
  }, 4000);
  btn.dataset.armTimer = String(timer);
}
// 등장 애니메이션이 끝나면 transform을 놓아준다 — 안 그러면 hover/active 때 쓰는
// transform(살짝 뜨기, 눌림 등)이 애니메이션이 붙잡고 있는 값에 가려서 안 먹는다.
document.addEventListener('animationend', (e) => {
  if (['cardDrop', 'viewIn', 'emptyAppear'].includes(e.animationName)) e.target.style.animation = 'none';
});
function addMinutes(hhmm, minutes) {
  const [h, m] = hhmm.split(':').map(Number);
  const total = h * 60 + m + minutes;
  const hh = String(Math.floor(total / 60) % 24).padStart(2, '0');
  const mm = String(total % 60).padStart(2, '0');
  return `${hh}:${mm}`;
}
function formatLocalDate(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}
function dowLabel(dateStr) {
  const [y, m, d] = dateStr.split('-').map(Number);
  return ['일', '월', '화', '수', '목', '금', '토'][new Date(y, m - 1, d).getDay()];
}

/*****************************************************
 * 화면 스택
 *****************************************************/
let viewStack = [];
let currentView = null;

/** 화면이 코르크보드에 새로 붙듯 살짝 떠오르는 전환 애니메이션을 다시 재생한다
 * (클래스를 껐다 리플로우 후 다시 켜야 매번 새로 재생된다). */
function playViewIn(direction) {
  const main = $('#main');
  main.classList.remove('view-in-fwd', 'view-in-back');
  void main.offsetWidth;
  main.classList.add(direction === 'back' ? 'view-in-back' : 'view-in-fwd');
}
function setView(name, render, noPush) {
  if (!noPush && currentView) viewStack.push(currentView);
  currentView = { name, render };
  $('#backBtn').style.display = viewStack.length > 0 ? 'inline-flex' : 'none';
  render();
  playViewIn('fwd');
  window.scrollTo(0, 0);
}
function goBack() {
  if (viewStack.length === 0) return;
  currentView = viewStack.pop();
  $('#backBtn').style.display = viewStack.length > 0 ? 'inline-flex' : 'none';
  currentView.render();
  playViewIn('back');
  window.scrollTo(0, 0);
}
function goHome() {
  viewStack = [];
  currentView = null;
  parentState = { parentCode: null, pageData: null, selectedDate: null };
  renderHome();
  playViewIn('back');
  window.scrollTo(0, 0);
}
function goTeacherDashboard() {
  viewStack = [];
  currentView = null;
  renderTeacherDashboard();
  playViewIn('back');
  window.scrollTo(0, 0);
}

/*****************************************************
 * 홈 화면
 *****************************************************/
function renderHome() {
  setView('home', () => {
    $('#main').innerHTML = `
      <div class="home-title">
        <span class="home-badge">상담예약도우미</span>
        <h1>우리지금만나</h1>
        <p>선생님과 만날 시간, 우리끼리 편하게 정해요</p>
      </div>
      <div class="home-choices">
        <div class="home-choice" onclick="startParent()">
          <div class="txt">
            <strong>상담 예약하기</strong>
            <span>선생님이 알려주신 코드로 예약해요</span>
          </div>
        </div>
      </div>
    `;
  }, true);
}

/*****************************************************
 * 학부모 플로우
 *****************************************************/
let parentState = { parentCode: null, pageData: null, selectedDate: null };

function startParent() {
  setView('parent-enter', () => {
    $('#main').innerHTML = `
      <div class="card">
        <h2>선생님이 알려주신 코드를 입력해주세요</h2>
        <div class="field">
          <input type="text" id="pc-code" maxlength="10" placeholder="예: A3F9K2"
                 style="text-align:center; letter-spacing:2px; text-transform:uppercase; font-size:16px;">
        </div>
        <button class="btn btn-primary btn-block" id="pc-submit">신청하러 가기</button>
      </div>
    `;
    $('#pc-code').focus();
    $('#pc-code').addEventListener('keypress', e => { if (e.key === 'Enter') submitParentCode(); });
    $('#pc-submit').addEventListener('click', submitParentCode);
  });
}

async function submitParentCode() {
  const code = $('#pc-code').value.trim().toUpperCase();
  if (!code) return toast('코드를 입력해주세요');
  const btn = $('#pc-submit');
  btn.disabled = true; btn.textContent = '확인 중...';
  try {
    await loadParentSchedule(code);
    renderParentTimetableView();
  } catch (err) {
    btn.disabled = false; btn.textContent = '신청하러 가기';
    toast(err.message);
  }
}

async function loadParentSchedule(parentCode) {
  const data = await db.getPublicSchedule(parentCode);
  parentState.parentCode = parentCode;
  parentState.pageData = data;
  parentState.selectedDate = data.dates[0]?.date ?? null;
  history.replaceState(null, '', `${location.pathname}?code=${encodeURIComponent(parentCode)}`);
}

function renderParentTimetableView() {
  const data = parentState.pageData;
  setView('parent-timetable', () => {
    $('#main').innerHTML = `
      <div class="card">
        <h2>${gradeClassLabel(data.grade, data.teacher_class)} · ${escapeHtml(data.teacher_name)} 선생님</h2>
        <p class="subtitle">상담 신청 시간표예요</p>

        ${data.dates.length === 0 ? '<div class="empty-state"><p>현재 열려있는 상담 가능 시간이 없어요.</p></div>' : `
          <div id="pt-calendar" style="margin-bottom:16px;"></div>
          <div class="legend">
            <div class="legend-item"><div class="legend-box available"></div>예약 가능</div>
            <div class="legend-item"><div class="legend-box booked"></div>예약됨 (눌러서 취소)</div>
          </div>
          <div class="cb-wrap" id="pt-timetable"></div>
        `}
      </div>
    `;
    if (data.dates.length > 0) {
      renderParentCalendarWidget();
      renderParentTimetableBody();
    }
  });
}

function renderParentCalendarWidget() {
  renderParentCalendar($('#pt-calendar'), {
    availableDates: parentState.pageData.dates.map(d => d.date),
    selectedDate: parentState.selectedDate,
    onSelectDate: (date) => {
      parentState.selectedDate = date;
      renderParentCalendarWidget();
      renderParentTimetableBody();
    },
  });
}

function renderParentTimetableBody() {
  const area = $('#pt-timetable');
  const dateEntry = parentState.pageData.dates.find(d => d.date === parentState.selectedDate);
  area.innerHTML = `<div class="cb-title" style="opacity:.7;font-size:13px;margin-bottom:14px;">${dateEntry.date} (${dowLabel(dateEntry.date)})</div>`;
  for (const group of groupByPeriod(dateEntry.slots)) {
    const block = el(`<div class="period-group"></div>`);
    if (group.period_label) {
      block.innerHTML = `<div class="period-label"><strong>${escapeHtml(group.period_label)}</strong></div>`;
    } else if (group.period) {
      block.innerHTML = `<div class="period-label"><strong>${group.period}교시</strong><span>${group.period_range}</span></div>`;
    }
    const grid = document.createElement('div');
    block.appendChild(grid);
    area.appendChild(block);
    renderParentSlotGrid(grid, group.slots, {
      onEmptyClick: (slot) => openBookingModal(slot, dateEntry),
      onFilledClick: (slot, slotEl) => openCancelModal(slot, dateEntry, slotEl),
    }, dateEntry.duration_minutes);
  }
}

/*****************************************************
 * 예약 / 취소 모달
 *****************************************************/
function openBookingModal(slot, dateEntry) {
  const page = parentState.pageData;
  const endTime = addMinutes(slot.start_time.slice(0, 5), dateEntry.duration_minutes || 20);
  const periodText = periodDisplay(slot);
  const allowedModes = slot.mode === 'both' ? ['in_person', 'phone'] : [slot.mode];

  const methodChoices = allowedModes.map(m =>
    `<div class="choice" data-method="${m}">${m === 'in_person' ? '방문' : '전화'}</div>`
  ).join('');
  const purposeChoices = PURPOSES.map(p => `<div class="choice" data-purpose="${escapeHtml(p)}">${escapeHtml(p)}</div>`).join('');

  const bg = el(`
    <div class="modal-bg" id="bookBg">
      <div class="modal">
        <div class="modal-header">
          <h2>상담 예약</h2>
          <button class="modal-close" id="bookClose">✕</button>
        </div>
        <div class="booking-summary">
          <strong>${gradeClassLabel(page.grade, page.teacher_class)}</strong><br>
          ${dateEntry.date}${periodText} ${slot.start_time.slice(0, 5)} ~ ${endTime}
        </div>
        <div class="field">
          <label>학생 번호 <span class="req">*</span></label>
          <input type="number" id="bk-num" min="1" max="50" placeholder="예: 12">
        </div>
        <div class="field">
          <label>학생 이름 <span class="req">*</span></label>
          <input type="text" id="bk-sname" placeholder="예: 홍길동">
        </div>
        <div class="row">
          <div class="field">
            <label>학부모 성함 <span class="req">*</span></label>
            <input type="text" id="bk-pname" placeholder="예: 홍길동 학부모">
          </div>
          <div class="field">
            <label>학부모 연락처 <span class="req">*</span></label>
            <input type="tel" id="bk-pphone" placeholder="010-0000-0000">
          </div>
        </div>
        <div class="hint" style="margin-bottom:14px;">취소할 때는 여기 입력한 학부모 연락처로 본인 확인을 해요. 꼭 정확히 입력해주세요.</div>
        <div class="field">
          <label>상담 방법 <span class="req">*</span></label>
          <div class="choice-group" id="method-group">${methodChoices}</div>
          <div class="hint">선생님이 이 시간에 가능한 방법만 선택할 수 있어요</div>
        </div>
        <div class="field">
          <label>상담 목적 <span class="req">*</span> <span style="font-weight:400;color:var(--text-muted);font-size:12px;">(중복 선택 가능)</span></label>
          <div class="choice-group" id="purpose-group">${purposeChoices}</div>
        </div>
        <div class="field">
          <label>상담 내용 (선택)</label>
          <textarea id="bk-content" placeholder="선생님께 묻고 싶은 질문이나 미리 알려드릴 내용을 적어주세요"></textarea>
        </div>
        <div class="field" style="margin-top:20px;">
          <button class="btn btn-primary btn-block btn-lg" id="bk-submit">예약 신청하기</button>
        </div>
      </div>
    </div>
  `);
  document.getElementById('modalRoot').appendChild(bg);

  bg.addEventListener('click', (e) => { if (e.target === bg) closeModal(); });
  $('#bookClose', bg).addEventListener('click', closeModal);

  if (allowedModes.length === 1) $(`.choice[data-method]`, bg).classList.add('selected');
  $$('#method-group .choice', bg).forEach(c => {
    c.addEventListener('click', () => {
      $$('#method-group .choice', bg).forEach(x => x.classList.remove('selected'));
      c.classList.add('selected');
    });
  });
  $$('#purpose-group .choice', bg).forEach(c => {
    c.addEventListener('click', () => c.classList.toggle('selected'));
  });

  $('#bk-submit', bg).addEventListener('click', () => submitBooking(slot, dateEntry, bg));
}

function submitBooking(slot, dateEntry, bg) {
  const num = $('#bk-num', bg).value.trim();
  const sname = $('#bk-sname', bg).value.trim();
  const pname = $('#bk-pname', bg).value.trim();
  const pphone = $('#bk-pphone', bg).value.trim();
  const methodEl = $('#method-group .choice.selected', bg);
  const method = methodEl ? methodEl.dataset.method : '';
  const purposes = $$('#purpose-group .choice.selected', bg).map(x => x.dataset.purpose);
  const content = $('#bk-content', bg).value.trim();

  if (!num) return toast('학생 번호를 입력해주세요');
  if (!sname) return toast('학생 이름을 입력해주세요');
  if (!pname) return toast('학부모 성함을 입력해주세요');
  if (!pphone) return toast('학부모 연락처를 입력해주세요');
  if (!method) return toast('상담 방법을 선택해주세요');
  if (purposes.length === 0) return toast('상담 목적을 1개 이상 선택해주세요');

  armConfirm($('#bk-submit', bg), '정말 신청할까요? 다시 누르면 확정돼요', () => {
    doSubmitBooking(slot, dateEntry, bg, { num, sname, pname, pphone, method, purposes, content });
  });
}

async function doSubmitBooking(slot, dateEntry, bg, data) {
  const btn = $('#bk-submit', bg);
  btn.disabled = true; btn.textContent = '예약 중...';

  try {
    const page = parentState.pageData;
    const className = plainGradeClass(page.grade, page.teacher_class);
    const cancelToken = await db.bookSlot(
      parentState.parentCode, slot.slot_id,
      data.num, data.sname, className, data.pname, data.pphone, data.purposes, data.content, data.method
    );
    slot.occupied = true;
    slot.booking_ref = { student_number: data.num, cancel_token: cancelToken };
    closeModal();
    showBookingSuccess(slot, dateEntry, data.sname, data.method);
  } catch (err) {
    btn.disabled = false; btn.textContent = '예약 신청하기';
    btn.classList.remove('btn-confirm-armed');
    if (err.message === 'ALREADY_BOOKED') toast('방금 다른 분이 신청했어요. 새로고침해서 다른 시간을 골라주세요.');
    else toast(err.message);
  }
}

function showBookingSuccess(slot, dateEntry, studentName, method) {
  setView('parent-done', () => {
    const page = parentState.pageData;
    const periodText = periodDisplay(slot);
    $('#main').innerHTML = `
      <div class="card" style="text-align:center;padding:36px 22px;">
        <div class="success-badge"></div>
        <h1 style="font-size:20px;">예약이 완료되었어요!</h1>
        <p class="subtitle">선생님께 신청 내용이 전달됩니다</p>
        <div style="background:var(--primary-soft);padding:16px;border-radius:12px;text-align:left;margin:16px 0;">
          <div style="margin-bottom:6px;"><strong>선생님</strong> · ${gradeClassLabel(page.grade, page.teacher_class)} ${escapeHtml(page.teacher_name)}</div>
          <div style="margin-bottom:6px;"><strong>학생</strong> · ${escapeHtml(studentName)}</div>
          <div style="margin-bottom:6px;"><strong>일시</strong> · ${dateEntry.date}${periodText} ${slot.start_time.slice(0, 5)}</div>
          <div><strong>상담 방법</strong> · ${MODE_LABEL[method]}</div>
        </div>
        <div class="info-box">
          <div>예약을 취소하려면, 시간표에서 본인이 예약한 포스트잇 칸을 다시 눌러 <strong>예약할 때 입력한 학부모 연락처</strong>를 입력하시면 됩니다.</div>
        </div>
        <button class="btn btn-primary btn-block" onclick="goHome()">홈으로 돌아가기</button>
        <button class="btn btn-ghost btn-block" style="margin-top:8px;" id="pd-back">이 시간표로 돌아가기</button>
      </div>
    `;
    $('#pd-back').addEventListener('click', goBack);
  });
}

function openCancelModal(slot, dateEntry, slotEl) {
  const ref = slot.booking_ref;
  if (!ref?.cancel_token) return toast('이 예약은 취소 정보를 불러올 수 없습니다.');
  const periodText = periodDisplay(slot);
  const page = parentState.pageData;

  const bg = el(`
    <div class="modal-bg" id="cancelBg">
      <div class="modal">
        <div class="modal-header">
          <h2>예약 취소</h2>
          <button class="modal-close" id="cancelClose">✕</button>
        </div>
        <div class="booking-summary">
          <strong>${gradeClassLabel(page.grade, page.teacher_class)}</strong><br>
          ${dateEntry.date}${periodText} ${slot.start_time.slice(0, 5)}
        </div>
        <div class="info-box danger">
          <div>본인이 예약한 내용이 맞다면, 예약할 때 입력한 <strong>학부모 연락처</strong>를 입력하고 취소해주세요.</div>
        </div>
        <div class="field">
          <label>학부모 연락처 <span class="req">*</span></label>
          <input type="tel" id="cx-phone" placeholder="예약할 때 입력한 연락처">
        </div>
        <div style="display:flex;gap:8px;margin-top:16px;">
          <button class="btn btn-ghost" style="flex:1;" id="cx-close">닫기</button>
          <button class="btn btn-danger" style="flex:1;" id="cx-submit">예약 취소하기</button>
        </div>
      </div>
    </div>
  `);
  document.getElementById('modalRoot').appendChild(bg);
  bg.addEventListener('click', (e) => { if (e.target === bg) closeModal(); });
  $('#cancelClose', bg).addEventListener('click', closeModal);
  $('#cx-close', bg).addEventListener('click', closeModal);
  setTimeout(() => $('#cx-phone', bg).focus(), 100);
  $('#cx-phone', bg).addEventListener('keypress', e => { if (e.key === 'Enter') doCancelBooking(slot, slotEl, bg); });
  $('#cx-submit', bg).addEventListener('click', () => doCancelBooking(slot, slotEl, bg));
}

function doCancelBooking(slot, slotEl, bg) {
  const phone = $('#cx-phone', bg).value.trim();
  if (!phone) return toast('학부모 연락처를 입력해주세요');

/** 서버에 저장된 날짜들의 시간 구조·날짜별 열림 상태를 편집용 틀(periodPattern/dateOpen)로 되살린다.
 * 요일마다 점심 위치가 다를 수 있으므로, 요일(월~금)별로 각각 구조를 되짚는다. */
function derivePatternFromDates() {
  const entries = [...teacherState.dates.values()];
  if (entries.length === 0) {
    // 슬롯을 미리 만들어두지 않는다 — 선생님이 "시간표 만들기"를 직접 눌러야
    // 요일별 시간표가 나타난다(그래야 점심시간 등 직접 고른 설정이 항상 반영된다).
    if (!teacherState.periodPattern) {
      teacherState.periodPattern = { preset: null, duration_minutes: 20, periodSlotsByDow: {}, extraSlots: [], lunch: null };
    }
    teacherState.dateOpen = {};
    return;
  }

  // periodSlotsByDow/extraSlots는 순전히 "교시 시간 구조"만 나타낸다. 실제 열림·방법 상태는 전부
  // dateOpen 쪽 명시적인 값으로만 판단하므로, 여기서는 항상 닫힘을 기본값으로 둔다
  // (그렇지 않으면 기준으로 삼은 날짜의 상태가 다른 모든 날짜의 기본값으로 새어나간다).
  const base = entries[0];
  const cleanSlot = ({ start_time, period, period_range, period_label }) =>
    ({ start_time, period, period_range, period_label, is_open: false, mode: 'both' });

  // 같은 요일의 날짜가 여러 개 저장돼 있으면, 그중 가장 먼저 만난 걸 그 요일의 기준 구조로 삼는다.
  const byDowEntry = {};
  for (const entry of entries) {
    const dow = new Date(entry.date + 'T00:00:00').getDay();
    if (!byDowEntry[dow]) byDowEntry[dow] = entry;
  }

  const extraSlots = base.slots.filter(s => !s.period).map(cleanSlot);
  const periodSlotsByDow = {};
  const lunchByDow = {};
  for (const dow of DOW_KEYS) {
    const entry = byDowEntry[dow] || base; // 저장된 날짜가 없는 요일은 일단 전체 기준 구조를 빌려 쓴다
    const daySlots = entry.slots.filter(s => s.period).map(cleanSlot);
    periodSlotsByDow[dow] = daySlots;
    lunchByDow[dow] = inferLunchFromSlots(daySlots, entry.duration_minutes ?? base.duration_minutes);
  }

  const observedDows = Object.keys(byDowEntry).map(Number);
  const refDow = observedDows[0] ?? 1;
  const perWeekday = observedDows.length > 1 && observedDows.some((dow) => {
    const a = lunchByDow[dow], b = lunchByDow[refDow];
    return a.enabled !== b.enabled || a.afterPeriod !== b.afterPeriod || a.minutes !== b.minutes;
  });

  teacherState.periodPattern = {
    preset: base.preset,
    duration_minutes: base.duration_minutes,
    periodSlotsByDow,
    extraSlots,
    lunch: { perWeekday, shared: lunchByDow[refDow], byDow: lunchByDow },
  };

  // dateOpen은 날짜 -> 상담 슬롯(시작 시각)마다 따로 상태를 기억한다. 한 교시 안에 상담이
  // 2개 들어가면(예: 20분씩 2번) 그 둘을 각각 열고 닫을 수 있어야 하기 때문에, 교시 단위가
  // 아니라 슬롯의 실제 시작 시각 단위로 저장한다.
  const dateOpen = {};
  for (const entry of entries) {
    dateOpen[entry.date] = {};
    for (const s of entry.slots) {
      dateOpen[entry.date][s.start_time] = { is_open: s.is_open, mode: s.mode };
    }
  }
  teacherState.dateOpen = dateOpen;
}

/** 저장된 슬롯 시각만 보고 점심시간이 어디 있었는지 되짚는다(교시 사이 뜬 간격 중
 * 가장 크면서, 평범한 쉬는시간(10분)보다 뚜렷하게 긴 곳). DB에는 점심시간을 따로
 * 저장하지 않으므로, 새로고침 뒤 점심 줄을 다시 보여주려면 이렇게 역산해야 한다. */
function inferLunchFromSlots(slots, durationMinutes) {
  const groups = groupByPeriod(slots).filter(g => g.period);
  if (groups.length < 2) return { enabled: false };
  let best = null;
  for (let i = 0; i < groups.length - 1; i++) {
    const cur = groups[i];
    const next = groups[i + 1];
    const curEnd = hhmmToMinutes(cur.slots[cur.slots.length - 1].start_time.slice(0, 5)) + (durationMinutes || 20);
    const nextStart = hhmmToMinutes(next.slots[0].start_time.slice(0, 5));
    const gap = nextStart - curEnd;
    if (!best || gap > best.gap) best = { gap, afterPeriod: cur.period };
  }
  if (best && best.gap >= 25) return { enabled: true, afterPeriod: best.afterPeriod, minutes: best.gap };
  return { enabled: false };
}

function defaultDayLunch() { return { enabled: false, afterPeriod: 4, minutes: 50 }; }
function defaultLunchState() {
  const byDow = {};
  for (const d of DOW_KEYS) byDow[d] = defaultDayLunch();
  return { perWeekday: false, shared: defaultDayLunch(), byDow };
}

/** "요일마다 다르게"가 꺼져 있으면 모든 요일이 공통 설정(shared)을 쓰고, 켜져 있으면
 * 요일별로 따로 둔 설정(byDow)을 쓴다. */
function lunchFor(pattern, dow) {
  if (!pattern.lunch) return null;
  return pattern.lunch.perWeekday ? (pattern.lunch.byDow[dow] || defaultDayLunch()) : pattern.lunch.shared;
}

/** 이 요일에 실제로 쓰이는 슬롯 전체(교시 슬롯 + 방과후/직접설정 슬롯, 뒤엣것은 요일 공통)를 돌려준다. */
function slotsForDow(pattern, dow) {
  return [...(pattern.periodSlotsByDow?.[dow] || []), ...(pattern.extraSlots || [])];
}

function hasAnyPatternSlots(pattern) {
  return DOW_KEYS.some(d => (pattern.periodSlotsByDow?.[d]?.length || 0) > 0) || (pattern.extraSlots?.length || 0) > 0;
}

/** 클립보드로 복사한다(구형 브라우저·비보안 컨텍스트에서는 textarea+execCommand로 대신한다). */
async function copyToClipboard(text, successMsg) {
  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(text);
    } else {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
    }
    toast(successMsg || '복사했어요');
  } catch (err) {
    toast('복사에 실패했어요. 직접 선택해서 복사해주세요.');
  }
}

/** 폼에 입력된 값대로 요일별 교시 시간 구조(periodSlotsByDow)를 다시 만든다. 점심시간을
 * 드래그로 옮길 때도 해당 요일의 "몇 교시 뒤" 값만 바꾼 뒤 이 함수를 다시 불러 재사용한다. */
/** 1단계 폼(기본 형태)의 현재 값을 읽어 pattern에 반영하고, 요일별 슬롯을 처음부터 만든다.
 * "시간표 만들기"를 눌러 2단계(요일별 시간표)로 넘어갈 때만 호출한다. */
function readFormIntoPattern() {
  const pattern = teacherState.periodPattern;
  const preset = $('#presetSelect').value;
  const consultMinutes = Number($('#consultMinutes').value) || 20;
  pattern.preset = preset;
  pattern.duration_minutes = consultMinutes;

  if (preset === 'custom') {
    pattern.periodSlotsByDow = Object.fromEntries(DOW_KEYS.map(d => [d, []]));
    pattern.extraSlots = buildCustomSlots({ startTime: $('#customStart').value, endTime: $('#customEnd').value, consultMinutes });
    pattern.lunch = null;
    return;
  }

  pattern.startTime = $('#presetStart').value || '09:00';
  pattern.periodCount = Number($('#periodCount').value) || 6;
  const lunchOn = $('#lunchEnable').checked;
  const perWeekday = lunchOn && Boolean($('#lunchPerWeekday')?.checked);

  if (!pattern.lunch) pattern.lunch = defaultLunchState();
  pattern.lunch.perWeekday = perWeekday;

  if (!lunchOn) {
    pattern.lunch.shared = { ...pattern.lunch.shared, enabled: false };
    for (const d of DOW_KEYS) pattern.lunch.byDow[d] = { ...pattern.lunch.byDow[d], enabled: false };
  } else if (!perWeekday) {
    pattern.lunch.shared = { enabled: true, afterPeriod: Number($('#lunchAfter').value) || 4, minutes: Number($('#lunchMinutes').value) || 50 };
  } else {
    for (const d of DOW_KEYS) {
      pattern.lunch.byDow[d] = {
        enabled: $(`#lunchEnable-${d}`)?.checked || false,
        afterPeriod: Number($(`#lunchAfter-${d}`)?.value) || 4,
        minutes: Number($(`#lunchMinutes-${d}`)?.value) || 50,
      };
    }
  }

  regeneratePatternSlots();
}

/** pattern에 이미 저장된 값(preset·시작시각·교시수·점심 위치)만으로 요일별 슬롯을 다시 만든다.
 * 2단계(요일별 시간표) 화면에서 점심시간을 드래그로 옮길 때처럼, 폼 없이 다시 계산할 때 쓴다. */
function regeneratePatternSlots() {
  const pattern = teacherState.periodPattern;
  if (pattern.preset === 'custom') return;
  const startTime = pattern.startTime || '09:00';
  const periodCount = pattern.periodCount || 6;
  pattern.periodSlotsByDow = {};
  for (const d of DOW_KEYS) {
    const lc = lunchFor(pattern, d);
    pattern.periodSlotsByDow[d] = buildPresetSlots({
      preset: pattern.preset, startTime, periodCount, consultMinutes: pattern.duration_minutes,
      lunchAfterPeriod: lc?.enabled ? lc.afterPeriod : null,
      lunchMinutes: lc?.minutes || 50,
    });
  }
}

/** 점심시간 줄을 다른 교시 사이로 옮긴다(드래그 앤 드롭으로 놓았을 때 호출). dow가 없으면
 * "요일마다 다르게"가 꺼져 있는 것이므로 공통 설정을 옮긴다. */
function moveLunch(dow, newAfterPeriod) {
  const pattern = teacherState.periodPattern;
  if (!pattern.lunch) return;
  if (pattern.lunch.perWeekday && dow) {
    const lc = pattern.lunch.byDow[dow];
    if (!lc?.enabled || lc.afterPeriod === newAfterPeriod) return;
    lc.afterPeriod = newAfterPeriod;
    const input = $(`#lunchAfter-${dow}`);
    if (input) input.value = newAfterPeriod;
  } else {
    const lc = pattern.lunch.shared;
    if (!lc?.enabled || lc.afterPeriod === newAfterPeriod) return;
    lc.afterPeriod = newAfterPeriod;
    const input = $('#lunchAfter');
    if (input) input.value = newAfterPeriod;
  }
  regeneratePatternSlots();
  renderPatternGrid();
  toast(`점심시간을 ${newAfterPeriod}교시 뒤로 옮겼어요`);
}

}

/** 이 날짜·이 상담 슬롯(시작 시각)에 실제 예약이 있는지 본다. */
function isDateSlotBooked(date, startTime) {
  const entry = teacherState.dates.get(date);
  if (!entry) return false;
  const slot = entry.slots.find(s => s.start_time === startTime);
  return Boolean(slot?.booking);
}

/** dateOpen에 저장된 값이 있으면 그걸, 없으면 이 슬롯의 기본 상태를 돌려준다. */
function getEffectiveDateState(date, startTime, baseSlot) {
  return teacherState.dateOpen[date]?.[startTime] || { is_open: baseSlot.is_open, mode: baseSlot.mode };
}

function toggleDateOpen(date, startTime, baseSlot) {
  if (!teacherState.dateOpen[date]) teacherState.dateOpen[date] = {};
  const cur = getEffectiveDateState(date, startTime, baseSlot);
  teacherState.dateOpen[date][startTime] = cur.is_open
    ? { is_open: false, mode: cur.mode }
    : { is_open: true, mode: cur.mode || 'both' };
  teacherState.justChangedKey = `${date}|${startTime}`;
  renderPatternGrid();
}

function toggleDateMethod(date, startTime, method, baseSlot) {
  if (!teacherState.dateOpen[date]) teacherState.dateOpen[date] = {};
  const cur = getEffectiveDateState(date, startTime, baseSlot);
  const modes = new Set(cur.mode === 'both' ? ['in_person', 'phone'] : cur.mode ? [cur.mode] : []);
  if (modes.has(method)) modes.delete(method); else modes.add(method);
  const isOpen = modes.size > 0;
  const mode = modes.size === 2 ? 'both' : modes.size === 1 ? [...modes][0] : (cur.mode || 'both');
  teacherState.dateOpen[date][startTime] = { is_open: isOpen, mode };
  teacherState.justChangedKey = `${date}|${startTime}`;
  renderPatternGrid();
}

function formatMonthDay(dateStr) {
  const [, m, d] = dateStr.split('-').map(Number);
  return `${m}월 ${d}일`;
}

/** 날짜가 속한 주의 월요일 날짜를 'YYYY-MM-DD'로 돌려준다(주 단위로 묶는 기준 키). */
function weekKeyOf(dateStr) {
  const d = new Date(dateStr + 'T00:00:00');
  const monday = new Date(d);
  monday.setDate(d.getDate() - (d.getDay() - 1));
  return formatLocalDate(monday);
}

/** 달력에서 고른 날짜들을 주 단위로 묶는다. 예: { '2026-09-07': {1:'2026-09-07', 3:'2026-09-09'} }. */
function groupSelectedByWeek() {
  const weeks = new Map();
  for (const d of teacherState.selectedDates) {
    const wk = weekKeyOf(d);
    const wd = new Date(d + 'T00:00:00').getDay();
    if (!weeks.has(wk)) weeks.set(wk, {});
    weeks.get(wk)[wd] = d;
  }
  return weeks;
}

function renderPatternGrid() {
  const pattern = teacherState.periodPattern;
  const container = $('#weekdayGrid');
  if (!hasAnyPatternSlots(pattern)) { container.innerHTML = '<p class="hint">먼저 위에서 시간표를 만들어주세요.</p>'; return; }

  const weeks = groupSelectedByWeek();
  if (weeks.size === 0) {
    container.innerHTML = '<p class="hint">먼저 위 달력에서 날짜를 골라주세요. 고른 날짜가 있는 주만큼 시간표가 늘어나요.</p>';
    return;
  }

  // 참고용 구조: 교시 개수·소슬롯 개수는 모든 요일이 같고(점심 위치로 "시각"만 달라진다),
  // 방과후/직접설정 슬롯은 요일 공통이라 어느 요일을 기준으로 잡아도 같다.
  const refDow = DOW_KEYS.find(d => (pattern.periodSlotsByDow?.[d]?.length || 0) > 0) || DOW_KEYS[0];
  const groups = groupByPeriod(slotsForDow(pattern, refDow));
  const periodNumbers = groups.map(g => g.period).filter(Boolean);
  const maxPeriod = periodNumbers.length ? Math.max(...periodNumbers) : 0;
  const perWeekday = Boolean(pattern.lunch?.perWeekday);
  const lunchBoundaries = new Set();
  for (const d of DOW_KEYS) {
    const lc = lunchFor(pattern, d);
    if (lc?.enabled) lunchBoundaries.add(lc.afterPeriod);
  }
  const lunchInUse = lunchBoundaries.size > 0; // 점심을 쓰고 있으면 다른 교시 사이에도 옮겨 놓을 자리를 보여준다

  const sortedWeekKeys = [...weeks.keys()].sort();
  let html = '';
  sortedWeekKeys.forEach((wk, idx) => {
    const days = weeks.get(wk);
    const friday = new Date(wk + 'T00:00:00');
    friday.setDate(friday.getDate() + 4);
    const weekRange = `${formatMonthDay(wk)} ~ ${formatMonthDay(formatLocalDate(friday))}`;

    html += `<h4 class="wd-week-title">${idx + 1}주차 (${weekRange})</h4>`;
    html += '<div class="wd-grid-wrap"><table class="wd-grid"><thead><tr><th></th>' +
      WEEKDAY_LABELS.slice(1).map((label, i) => {
        const w = i + 1;
        const date = days[w];
        return `<th>${label}${date ? `<br><span class="wd-col-date">${formatMonthDay(date)}</span>` : ''}</th>`;
      }).join('') + '</tr></thead><tbody>';

    for (const group of groups) {
      const groupKey = group.period ?? (group.period_label ?? 'custom');
      const headLabel = group.period_label || (group.period ? `${group.period}교시` : '직접 설정');
      const start = group.slots[0].start_time.slice(0, 5);
      const lastSlot = group.slots[group.slots.length - 1];
      const end = addMinutes(lastSlot.start_time.slice(0, 5), pattern.duration_minutes || 20);
      const range = group.period_range || `${start}~${end}`;

      // 요일마다 이 교시의 그룹을 미리 찾아둔다(방과후 등 요일-공통 슬롯은 이 group을 그대로 쓴다).
      const dayGroups = {};
      if (group.period) {
        for (let w = 1; w <= 5; w++) {
          dayGroups[w] = groupByPeriod(pattern.periodSlotsByDow?.[w] || []).find(g => g.period === group.period) || group;
        }
      }

      group.slots.forEach((refSlot, subIdx) => {
        html += '<tr>';
        if (subIdx === 0) {
          html += `<th class="wd-row-head" rowspan="${group.slots.length}" data-period-key="${groupKey}">${escapeHtml(headLabel)}<br><span class="wd-row-time">${range}</span><span class="wd-edit-icon">✎</span></th>`;
        }
        for (let w = 1; w <= 5; w++) {
          const date = days[w];
          if (!date) { html += `<td class="wd-cell wd-cell--empty"></td>`; continue; }
          const slot = group.period ? (dayGroups[w].slots[subIdx] || refSlot) : refSlot;
          const booked = isDateSlotBooked(date, slot.start_time);
          const state = getEffectiveDateState(date, slot.start_time, slot);
          const cls = ['wd-cell'];
          if (booked) cls.push('wd-cell--booked');
          else if (state.is_open) cls.push('wd-cell--open');
          if (teacherState.justChangedKey === `${date}|${slot.start_time}`) cls.push('wd-cell--pulse');
          html += `<td class="${cls.join(' ')}" data-date="${date}" data-start="${slot.start_time}">`;
          html += `<div class="wd-cell-time">${slot.start_time.slice(0, 5)}</div>`;
          if (booked) {
            html += `<span class="wd-cell-label">예약됨</span>`;
          } else if (state.is_open) {
            const modes = state.mode === 'both' ? ['in_person', 'phone'] : [state.mode];
            html += modes.map(m => `<span class="wd-method-tag ${m === 'phone' ? 'm-phone' : 'm-visit'}" data-m="${m}">${m === 'phone' ? '전화' : '방문'}</span>`).join('');
          } else {
            html += `<span class="wd-cell-label">닫힘</span>`;
          }
          html += `</td>`;
        }
        html += '</tr>';
      });

      if (group.period && group.period < maxPeriod && lunchInUse) {
        if (!perWeekday) {
          // 공통 설정이므로 모든 요일이 같은 자리 — 현재 위치엔 통짜 바를, 다른 교시 사이엔
          // 옮겨 놓을 수 있는 빈 자리를 보여준다.
          const lc = pattern.lunch.shared;
          if (group.period === lc.afterPeriod) {
            html += `<tr class="wd-lunch-row" data-after-period="${group.period}">
              <td colspan="6"><div class="wd-lunch-cell">점심시간 · ${lc.minutes}분<span class="wd-lunch-handle">⠿ 눌러서 끌기</span></div></td>
            </tr>`;
          } else {
            html += `<tr class="wd-lunch-dropzone" data-after-period="${group.period}"><td colspan="6"><div class="wd-lunch-dropzone-bar"></div></td></tr>`;
          }
        } else {
          // 요일마다 다르므로 칸을 나눠, 그 요일의 점심이 여기 있으면 알약을, 아니면 놓을 자리를 보여준다.
          html += `<tr class="wd-lunch-row-multi"><th class="wd-row-head wd-row-head--lunch"><span class="wd-row-time">점심</span></th>`;
          for (let w = 1; w <= 5; w++) {
            const date = days[w];
            if (!date) { html += `<td class="wd-cell wd-cell--empty"></td>`; continue; }
            const lc = lunchFor(pattern, w);
            if (lc?.enabled && lc.afterPeriod === group.period) {
              html += `<td class="wd-lunch-cell-td"><div class="wd-lunch-cell wd-lunch-cell--mini" data-dow="${w}" data-after-period="${group.period}">${lc.minutes}분<span class="wd-lunch-handle">⠿</span></div></td>`;
            } else if (lc?.enabled) {
              html += `<td class="wd-lunch-dropzone-td" data-dow="${w}" data-after-period="${group.period}"><div class="wd-lunch-dropzone-bar"></div></td>`;
            } else {
              html += `<td class="wd-cell wd-cell--empty"></td>`;
            }
          }
          html += '</tr>';
        }
      }
    }
    html += '</tbody></table></div>';
  });
  container.innerHTML = html;
  teacherState.justChangedKey = null;
  wireLunchDrag(container, perWeekday);

  $$('.wd-cell:not(.wd-cell--booked):not(.wd-cell--empty)', container).forEach(cell => {
    const date = cell.dataset.date;
    const startTime = cell.dataset.start;
    const dow = new Date(date + 'T00:00:00').getDay();
    const slot = slotsForDow(pattern, dow).find(s => s.start_time === startTime);
    if (!slot) return;
    cell.addEventListener('click', (e) => {
      const methodTag = e.target.closest('.wd-method-tag');
      if (methodTag) {
        e.stopPropagation();
        toggleDateMethod(date, startTime, methodTag.dataset.m, slot);
      } else {
        toggleDateOpen(date, startTime, slot);
      }
    });
    const timeEl = cell.querySelector('.wd-cell-time');
    timeEl.addEventListener('click', (e) => e.stopPropagation());
    timeEl.addEventListener('dblclick', (e) => {
      e.stopPropagation();
      startEditSlotTime(slot);
    });
  });

  $$('.wd-row-head[data-period-key]', container).forEach(th => {
    const rawKey = th.dataset.periodKey;
    const key = /^\d+$/.test(rawKey) ? Number(rawKey) : rawKey;
    const group = groups.find(g => (g.period ?? (g.period_label ?? 'custom')) === key);
    th.addEventListener('click', () => startEditPeriodTime(group));
  });
}

/** 점심시간 줄(또는 요일별 알약)을 손가락/마우스로 눌러 끌면, 지나가는 자리(드롭존)가
 * 밝아지고 놓으면 그 교시 뒤로 옮겨진다. 포인터 이벤트라 마우스·터치 모두에서 동작한다. */
function wireLunchDrag(container, perWeekday) {
  if (!perWeekday) {
    const lunchRow = $('.wd-lunch-row', container);
    if (!lunchRow) return;
    const zones = $$('.wd-lunch-dropzone', container);
    const handle = $('.wd-lunch-cell', lunchRow);
    wirePointerDrag(handle, lunchRow, zones, (zone) => moveLunch(null, Number(zone.dataset.afterPeriod)));
    return;
  }
  $$('.wd-lunch-cell--mini', container).forEach((pill) => {
    const dow = pill.dataset.dow;
    const cell = pill.closest('td');
    const zones = $$(`.wd-lunch-dropzone-td[data-dow="${dow}"]`, container);
    wirePointerDrag(pill, cell, zones, (zone) => moveLunch(Number(dow), Number(zone.dataset.afterPeriod)));
  });
}

/** 공용 포인터 드래그: handle을 누른 채 위아래로 끌면, zones 중 세로 위치가 가장 가까운
 * 자리가 밝아지고(정확히 그 얇은 칸 위에 있어야 하는 게 아니라 "가장 가까운 자리"를 찾으므로
 * 빠르게 끌어도 잘 잡힌다), 놓았을 때 그 자리가 있었다면 onDrop(zone)을 부른다. 포인터
 * 이벤트라 마우스·터치 모두에서 동작한다. */
function wirePointerDrag(handle, moveEl, zones, onDrop) {
  if (zones.length === 0) return;
  const NEAR_PX = 60; // 이보다 멀면(다른 교시로 완전히 벗어났으면) 놓아도 무효
  handle.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    moveEl.classList.add('wd-lunch-row--dragging');
    const startY = e.clientY;
    const pointerId = e.pointerId;
    let activeZone = null;

    // setPointerCapture는 브라우저마다 손을 놓쳐서(캡처한 요소가 아니라 실제 커서 아래
    // 요소로 이벤트가 새는 경우가 있다) 대신 document 전체에서 듣는다 — 이러면 커서가
    // 무엇 위를 지나가든 항상 이 드래그가 이어진다.
    const onMove = (ev) => {
      if (ev.pointerId !== pointerId) return;
      moveEl.style.transform = `translateY(${ev.clientY - startY}px)`;
      let nearest = null, nearestDist = Infinity;
      for (const z of zones) {
        const r = z.getBoundingClientRect();
        const dist = Math.abs(ev.clientY - (r.top + r.height / 2));
        if (dist < nearestDist) { nearestDist = dist; nearest = z; }
      }
      const zone = nearestDist <= NEAR_PX ? nearest : null;
      if (zone !== activeZone) {
        activeZone?.classList.remove('wd-lunch-dropzone--active');
        activeZone = zone;
        activeZone?.classList.add('wd-lunch-dropzone--active');
      }
    };
    const onUp = (ev) => {
      if (ev.pointerId !== pointerId) return;
      moveEl.classList.remove('wd-lunch-row--dragging');
      moveEl.style.transform = '';
      zones.forEach(z => z.classList.remove('wd-lunch-dropzone--active'));
      document.removeEventListener('pointermove', onMove);
      document.removeEventListener('pointerup', onUp);
      document.removeEventListener('pointercancel', onUp);
      if (activeZone) onDrop(activeZone);
    };
    document.addEventListener('pointermove', onMove);
    document.addEventListener('pointerup', onUp);
    document.addEventListener('pointercancel', onUp);
  });
}

/** 이 시작 시각을 가진 상담 슬롯이 어느 날짜에서든 이미 예약됐는지 본다(시간은 모든
 * 날짜가 공유하므로, 하나라도 예약이 있으면 시간을 못 바꾸게 막아야 한다). */
function isSlotTimeBooked(startTime) {
  for (const entry of teacherState.dates.values()) {
    if (entry.slots.some(s => s.start_time === startTime && s.booking)) return true;
  }
  return false;
}

function hhmmToMinutes(hhmm) {
  const [h, m] = hhmm.split(':').map(Number);
  return h * 60 + m;
}

/** "HH:MM" 또는 "HH:MM:SS" 문자열에 분을 더해 같은 형식으로 돌려준다. */
function shiftTimeString(timeStr, deltaMinutes) {
  const hasSeconds = timeStr.length > 5;
  const shifted = addMinutes(timeStr.slice(0, 5), deltaMinutes);
  return hasSeconds ? `${shifted}:00` : shifted;
}

/** 시간 조정용 모달을 하나 띄운다. 적용을 누르면 onApply(newTime)이 "HH:MM:SS" 형식으로 호출된다. */
function openTimeEditModal({ title, subtitle, currentTime, onApply }) {
  const bg = el(`
    <div class="modal-bg" id="timeEditBg">
      <div class="modal" style="max-width:360px;">
        <div class="modal-header">
          <h2>${escapeHtml(title)}</h2>
          <button type="button" class="modal-close" id="timeEditClose">✕</button>
        </div>
        ${subtitle ? `<div class="booking-summary">${escapeHtml(subtitle)}</div>` : ''}
        <div class="field">
          <label>시작 시각</label>
          <input type="time" id="timeEditInput" value="${currentTime}">
        </div>
        <button type="button" class="btn btn-primary btn-block btn-lg" id="timeEditApply">적용하기</button>
      </div>
    </div>
  `);
  document.getElementById('modalRoot').appendChild(bg);
  bg.addEventListener('click', (e) => { if (e.target === bg) closeModal(); });
  $('#timeEditClose', bg).addEventListener('click', closeModal);
  const input = $('#timeEditInput', bg);
  setTimeout(() => input.focus(), 50);
  input.addEventListener('keydown', (e) => { if (e.key === 'Enter') $('#timeEditApply', bg).click(); });
  $('#timeEditApply', bg).addEventListener('click', () => {
    const val = input.value;
    closeModal();
    if (val) onApply(`${val}:00`);
  });
}

/** 상담 슬롯 하나(예: 20분짜리 한 칸)의 시작 시각만 따로 조정한다. */
function startEditSlotTime(slot) {
  if (isSlotTimeBooked(slot.start_time)) return toast('이미 예약이 있는 시간은 바꿀 수 없어요.');
  openTimeEditModal({
    title: '상담 시작 시각 조정',
    subtitle: `지금은 ${slot.start_time.slice(0, 5)}에 시작해요`,
    currentTime: slot.start_time.slice(0, 5),
    onApply: (newTime) => {
      slot.start_time = newTime;
      renderPatternGrid();
    },
  });
}

/** 교시 하나를 누르면, 그 교시 안의 상담 슬롯 전체(요일마다 다르게 설정했다면 모든 요일의
 * 같은 교시가 함께)를 같은 간격을 유지한 채 한꺼번에 밀거나 당길 수 있다. */
function startEditPeriodTime(group) {
  const pattern = teacherState.periodPattern;
  const allSlots = group.period
    ? DOW_KEYS.flatMap(d => groupByPeriod(pattern.periodSlotsByDow?.[d] || []).find(g => g.period === group.period)?.slots || [])
    : group.slots;
  if (allSlots.some(s => isSlotTimeBooked(s.start_time))) {
    return toast('이미 예약이 있는 교시는 시간을 바꿀 수 없어요.');
  }
  const firstSlot = group.slots[0];
  const label = group.period_label || (group.period ? `${group.period}교시` : '이 시간대');
  openTimeEditModal({
    title: `${label} 시간 조정`,
    subtitle: group.period
      ? '이 교시 안의 모든 요일 상담 슬롯이 같은 간격을 유지한 채 함께 옮겨져요'
      : '이 교시 안의 상담 슬롯 전체가 같은 간격을 유지한 채 함께 옮겨져요',
    currentTime: firstSlot.start_time.slice(0, 5),
    onApply: (newTime) => {
      const delta = hhmmToMinutes(newTime.slice(0, 5)) - hhmmToMinutes(firstSlot.start_time.slice(0, 5));
      if (delta !== 0) {
        allSlots.forEach(s => { s.start_time = shiftTimeString(s.start_time, delta); });
        if (firstSlot.period_range) {
          const [rs, re] = firstSlot.period_range.split('~');
          const newRange = `${addMinutes(rs, delta)}~${addMinutes(re, delta)}`;
          allSlots.forEach(s => { s.period_range = newRange; });
        }
      }
      renderPatternGrid();
    },
  });
}

async function saveAvailability() {
  const pattern = teacherState.periodPattern;
  const selected = [...teacherState.selectedDates];
  if (selected.length === 0) return toast('먼저 달력에서 날짜를 골라주세요');
  if (!hasAnyPatternSlots(pattern)) return toast('먼저 시간표 만들기를 눌러주세요');
  try {
    for (const d of selected) {
      const dow = new Date(d + 'T00:00:00').getDay();
      const slotsForDate = slotsForDow(pattern, dow).map((slot) => {
        const state = getEffectiveDateState(d, slot.start_time, slot);
        const { start_time, period, period_range, period_label } = slot;
        return { start_time, period, period_range, period_label, is_open: state.is_open, mode: state.mode };
      });
      await db.saveDateSlots(teacherState.pageId, teacherState.adminCode, d, pattern.preset, pattern.duration_minutes, slotsForDate);
    }
    await loadTeacherSchedule();
    goTeacherDashboard();
    toast(`${selected.length}개 날짜에 저장했어요`);
    await maybePublish();
  } catch (err) {
    toast(err.message);
  }
}

async function maybePublish() {
  if (teacherState.parentCode) return;
  try {
    const code = await db.publishPage(teacherState.pageId, teacherState.adminCode);
    teacherState.parentCode = code;
    toast(`학부모 공유 코드가 만들어졌어요: ${code}`);
  } catch (err) { /* 다음 저장 때 다시 시도 */ }
}

function openBookingsList() {
  setView('teacher-bookings', () => {
    $('#main').innerHTML = `<div class="loading"><div class="spinner"></div>예약 현황 로드 중...</div>`;
    loadTeacherSchedule().then(renderBookingsList).catch(err => {
      $('#main').innerHTML = `<div class="card"><p>${escapeHtml(err.message)}</p></div>`;
    });
  });
}

function renderBookingsList() {
  const today = formatLocalDate(new Date());
  const bookings = [];
  for (const [date, entry] of teacherState.dates) {
    for (const s of entry.slots) {
      if (s.booking) bookings.push({ date, slot_id: s.slot_id, start_time: s.start_time, ...s.booking });
    }
  }
  bookings.sort((a, b) => (a.date !== b.date ? (a.date < b.date ? -1 : 1) : a.start_time.localeCompare(b.start_time)));
  const upcoming = bookings.filter(b => b.date >= today);
  const past = bookings.filter(b => b.date < today);

  const renderOne = b => `
    <div class="booking-item">
      <div class="booking-item-head">
        <div>
          <div class="booking-item-title">${escapeHtml(b.student_number)}번 ${escapeHtml(b.student_name)}</div>
          <div class="booking-item-time">${b.date} · ${b.start_time}</div>
        </div>
        <button class="btn btn-danger" style="padding:6px 10px;font-size:12px;" data-slot="${b.slot_id}" data-name="${escapeHtml(b.student_name)}">취소</button>
      </div>
      <div class="booking-item-meta"><strong>학부모</strong> ${escapeHtml(b.parent_name)} · ${escapeHtml(b.parent_phone)}</div>
      <div>${b.mode === 'phone' ? '<span class="tag method-phone">전화</span>' : '<span class="tag method-visit">방문</span>'}${(b.topics || []).map(t => `<span class="tag">${escapeHtml(t)}</span>`).join('')}</div>
      ${b.notes ? `<div style="background:var(--disabled);padding:10px;border-radius:8px;font-size:13px;margin-top:6px;white-space:pre-wrap;">${escapeHtml(b.notes)}</div>` : ''}
    </div>
  `;

  $('#main').innerHTML = `
    <div class="stat-row">
      <div class="stat-card stat-coral"><div class="num">${upcoming.length}</div><div class="label">다가오는 예약</div></div>
      <div class="stat-card stat-mint"><div class="num">${bookings.length}</div><div class="label">전체 예약</div></div>
    </div>
    <div class="card">
      <h2>예약 현황</h2>
      <h3 style="margin-top:10px;">다가오는 예약</h3>
      ${upcoming.length === 0 ? '<div class="empty-state" style="padding:24px;"><p>예약된 상담이 없습니다</p></div>' : upcoming.map(renderOne).join('')}
      ${past.length > 0 ? `<h3 style="margin-top:22px;color:var(--text-muted);">지난 예약 (${past.length})</h3>${past.map(renderOne).join('')}` : ''}
    </div>
  `;
  $$('#main button[data-slot]').forEach(btn => {
    btn.addEventListener('click', () => {
      armConfirm(btn, '정말 취소?', () => doTeacherCancelBk(btn.dataset.slot, btn.dataset.name));
    });
  });
}

async function doTeacherCancelBk(slotId, studentName) {
  try {
    await db.teacherCancelBooking(teacherState.pageId, teacherState.adminCode, slotId);
    await loadTeacherSchedule();
    toast(`${studentName} 학생의 예약을 취소했어요`);
    renderBookingsList();
  } catch (err) { toast(err.message); }
}

/*****************************************************
 * 초기화

window.goHome = goHome;
window.goBack = goBack;
window.startParent = startParent;
window.startTeacher = startTeacher;
window.openAvailabilityEditor = openAvailabilityEditor;
window.openBookingsList = openBookingsList;

  const params = new URLSearchParams(location.search);
  const code = params.get('code');
  if (code) {
    $('#main').innerHTML = `<div class="loading"><div class="spinner"></div>시간표 로드 중...</div>`;
    loadParentSchedule(code).then(renderParentTimetableView).catch(err => {
      toast(err.message);
      renderHome();
    });
  } else {
    renderHome();
  }
})();
</script>
