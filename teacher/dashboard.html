<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>붙임상담소 — 상담 일정 관리</title>
  <link rel="stylesheet" href="../shared/chalkboard.css" />
  <style>
    body { margin:0; background:#f4f1e8; font-family:"Pretendard","Noto Sans KR",-apple-system,sans-serif; }
    .wrap { max-width:720px; margin:0 auto; padding:24px 16px 60px; }
    h1 { font-size:20px; color:#233d2e; }
    .picker { display:flex; gap:8px; align-items:center; margin:16px 0; flex-wrap:wrap; }
    .picker input[type=date] { padding:10px; border-radius:8px; border:1px solid #ddd; }
    .picker button { padding:10px 16px; border-radius:8px; border:0; background:#233d2e; color:#fff; font-weight:700; cursor:pointer; }
    .picker label { font-size:13px; color:#555; }
    .date-list { list-style:none; padding:0; display:flex; gap:8px; flex-wrap:wrap; margin:16px 0; }
    .date-list li { padding:8px 14px; border-radius:999px; background:#fff; border:1px solid #ddd; cursor:pointer; font-size:13px; }
    .date-list li.active { background:#233d2e; color:#fff; border-color:#233d2e; }
    #dateEditor { margin-top:24px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1 id="teacherTitle">상담 일정 관리</h1>
    <div class="picker">
      <label for="rangeStart">상담기간 시작일</label>
      <input type="date" id="rangeStart" />
      <label for="rangeEnd">종료일</label>
      <input type="date" id="rangeEnd" />
      <button id="createRangeBtn">상담기간 만들기</button>
    </div>
    <p style="color:#888; font-size:12px; margin:-8px 0 0;">주말은 자동으로 빠지고, 시간표는 이 기간 전체에 똑같이 적용돼요.</p>
    <ul class="date-list" id="dateList"></ul>
    <div id="dateEditor"></div>
    <div id="publishArea" style="margin-top:32px; padding-top:24px; border-top:1px solid #ddd;">
      <button id="publishBtn" style="padding:12px 20px; border-radius:8px; border:0; background:#c15b1e; color:#fff; font-weight:700; cursor:pointer;">설정 끝, 학부모 링크 만들기</button>
      <div id="publishResult" style="margin-top:12px; font-size:14px;"></div>
    </div>
  </div>

  <script type="module">
    import { db } from '../shared/db.js';

    const params = new URLSearchParams(location.search);
    const state = {
      pageId: params.get('page'),
      adminCode: params.get('code') || sessionStorage.getItem('buchim_admin_code') || '',
      teacherName: '',
      parentCode: null,
      published: false,
      dates: new Map(),      // dateStr -> { date_id, date, preset, duration_minutes, slots }
      selectedDate: null,
    };

    if (!state.pageId || !state.adminCode) {
      alert('선생님 등록 화면에서 다시 시작해주세요.');
      location.href = './setup.html';
    } else {
      if (state.pageId) {
        sessionStorage.setItem('buchim_admin_code', state.adminCode);
        history.replaceState(null, '', `./dashboard.html?page=${encodeURIComponent(state.pageId)}`);
      }
      loadSchedule().catch(err => alert(err.message));
    }

    async function loadSchedule() {
      const data = await db.getTeacherSchedule(state.pageId, state.adminCode);
      state.teacherName = data.teacher_name;
      state.parentCode = data.parent_code;
      state.published = data.published;
      state.dates = new Map(data.dates.map(d => [d.date, {
        ...d,
        slots: d.slots.map(s => ({ ...s, start_time: s.start_time.slice(0, 5) })),
      }]));
      document.getElementById('teacherTitle').textContent = `${state.teacherName} 선생님의 상담 일정`;
      renderDateList();
    }

    function renderDateList() {
      const list = document.getElementById('dateList');
      list.innerHTML = '';
      const sorted = [...state.dates.keys()].sort();
      for (const dateStr of sorted) {
        const li = document.createElement('li');
        li.textContent = dateStr;
        if (dateStr === state.selectedDate) li.classList.add('active');
        li.addEventListener('click', () => selectDate(dateStr));
        list.appendChild(li);
      }
    }

    function selectDate(dateStr) {
      state.selectedDate = dateStr;
      renderDateList();
      window.dispatchEvent(new CustomEvent('buchim:date-selected', { detail: dateStr }));
    }

    function formatLocalDate(d) {
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${day}`;
    }

    function weekdaysBetween(startStr, endStr) {
      // toISOString()은 UTC로 바꿔버려서 시간대에 따라 날짜가 하루 밀릴 수 있다.
      // 지역 시각(년/월/일)만 그대로 읽어서 문자열로 만든다.
      const days = [];
      const cursor = new Date(startStr + 'T00:00:00');
      const end = new Date(endStr + 'T00:00:00');
      while (cursor <= end) {
        const day = cursor.getDay();
        if (day !== 0 && day !== 6) days.push(formatLocalDate(cursor));
        cursor.setDate(cursor.getDate() + 1);
      }
      return days;
    }

    document.getElementById('createRangeBtn').addEventListener('click', () => {
      const startVal = document.getElementById('rangeStart').value;
      const endVal = document.getElementById('rangeEnd').value;
      if (!startVal || !endVal) { alert('시작일과 종료일을 모두 골라주세요.'); return; }
      if (startVal > endVal) { alert('종료일이 시작일보다 빠를 수 없어요.'); return; }
      const days = weekdaysBetween(startVal, endVal);
      if (days.length === 0) { alert('그 사이에 평일이 없어요.'); return; }
      for (const d of days) {
        if (!state.dates.has(d)) {
          state.dates.set(d, { date: d, preset: 'middle', duration_minutes: 20, slots: [] });
        }
      }
      selectDate(days[0]);
    });

    window.buchimState = state;
    window.buchimRenderDateList = renderDateList;
    window.buchimSelectDate = selectDate;
    window.buchimLoadSchedule = loadSchedule;
  </script>

  <script type="module">
    import { buildPresetSlots, buildCustomSlots } from '../shared/timetable-presets.js';
    import { createSlotGrid } from '../shared/chalkboard.js';
    import { db } from '../shared/db.js';
    import { escapeHtml } from '../shared/escape.js';

    const editor = document.getElementById('dateEditor');

    function renderEditor(dateStr) {
      const state = window.buchimState;
      const entry = state.dates.get(dateStr);
      editor.innerHTML = `
        <div class="cb-wrap">
          <div class="cb-title">${dateStr} 상담 시간표 (이 기간 전체에 똑같이 적용됩니다)</div>
          <div style="display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap; align-items:center;">
            <select id="presetSelect">
              <option value="middle">중학교형 (45분 수업)</option>
              <option value="high">고등학교형 (50분 수업)</option>
              <option value="custom">직접 설정</option>
            </select>
            <span id="presetRange">
              시작 <input type="time" id="presetStart" value="09:00" />
              교시 수 <input type="number" id="periodCount" min="1" max="10" value="6" style="width:50px;" />
            </span>
            <span id="customRange" style="display:none;">
              시작 <input type="time" id="customStart" value="09:00" />
              종료 <input type="time" id="customEnd" value="16:00" />
            </span>
            상담시간(분) <input type="number" id="consultMinutes" min="5" max="120" value="${entry.duration_minutes || 20}" style="width:60px;" />
            <button id="generateBtn">시간표 만들기</button>
          </div>
          <div id="slotGrid"></div>
          <button id="saveDateBtn" style="margin-top:16px; padding:10px 18px; border-radius:8px; border:0; background:#233d2e; color:#fff; font-weight:700; cursor:pointer;">이 기간 전체 저장</button>
        </div>
      `;

      document.getElementById('presetSelect').value = entry.preset || 'middle';
      const isCustom = entry.preset === 'custom';
      document.getElementById('presetRange').style.display = isCustom ? 'none' : 'inline';
      document.getElementById('customRange').style.display = isCustom ? 'inline' : 'none';

      document.getElementById('presetSelect').addEventListener('change', (e) => {
        const custom = e.target.value === 'custom';
        document.getElementById('presetRange').style.display = custom ? 'none' : 'inline';
        document.getElementById('customRange').style.display = custom ? 'inline' : 'none';
      });

      document.getElementById('generateBtn').addEventListener('click', () => {
        const preset = document.getElementById('presetSelect').value;
        const consultMinutes = Number(document.getElementById('consultMinutes').value) || 20;
        let slots;
        if (preset === 'custom') {
          const startTime = document.getElementById('customStart').value;
          const endTime = document.getElementById('customEnd').value;
          slots = buildCustomSlots({ startTime, endTime, consultMinutes });
        } else {
          const startTime = document.getElementById('presetStart').value || '09:00';
          const periodCount = Number(document.getElementById('periodCount').value) || 6;
          slots = buildPresetSlots({ preset, startTime, periodCount, consultMinutes });
        }
        entry.preset = preset;
        entry.duration_minutes = consultMinutes;
        entry.slots = slots;
        renderGrid(dateStr);
      });

      renderGrid(dateStr);

      document.getElementById('saveDateBtn').addEventListener('click', async () => {
        const allDates = [...state.dates.keys()];
        const strippedSlots = entry.slots.map(({ start_time, mode, is_open, period, period_range }) => ({ start_time, mode, is_open, period, period_range }));
        try {
          for (const d of allDates) {
            await db.saveDateSlots(state.pageId, state.adminCode, d, entry.preset, entry.duration_minutes, strippedSlots);
          }
          await window.buchimLoadSchedule();
          window.buchimSelectDate(dateStr);
          alert(`${allDates.length}개 날짜에 저장했어요.`);
        } catch (err) {
          alert(err.message);
        }
      });
    }

    // entry.slots를 교시 단위로 묶는다("custom"으로 만든 슬롯은 period가 없어 한 묶음이 된다).
    function groupByPeriod(slots) {
      const groups = [];
      const byKey = new Map();
      for (const slot of slots) {
        const key = slot.period ?? 'custom';
        if (!byKey.has(key)) {
          const group = { period: slot.period, period_range: slot.period_range, slots: [] };
          byKey.set(key, group);
          groups.push(group);
        }
        byKey.get(key).slots.push(slot);
      }
      return groups;
    }

    function renderSlotGroup(dateStr, container, slots) {
      const grid = document.createElement('div');
      grid.className = 'cb-grid';
      container.appendChild(grid);

      // slots의 실제 객체를 그대로 넘긴다 (스프레드 복사본을 넘기면 onEmptyClick이
      // 복사본만 고치고 entry.slots는 그대로 남아, 클릭이 저장되지 않는다).
      const gridSlots = slots.map(s => { s.occupied = Boolean(s.booking); return s; });
      createSlotGrid(grid, gridSlots, {
        // 닫힌 칸을 클릭하면 연다. 이미 열린(예약 없는) 칸을 클릭하면 상담방식 팝업을 띄운다
        // (Task 10). 리스너를 두 개 겹쳐 달면 "열기"와 "팝업 띄우기"가 한 클릭에 동시에
        // 발생해 방금 연 칸이 그대로 닫혀버리는 문제가 생기므로, 분기를 하나로 합친다.
        onEmptyClick: (slot) => {
          if (slot.is_open) {
            window.dispatchEvent(new CustomEvent('buchim:slot-clicked', { detail: { dateStr, slot } }));
          } else {
            slot.is_open = true;
            renderGrid(dateStr);
          }
        },
        onFilledClick: (slot) => {
          window.dispatchEvent(new CustomEvent('buchim:slot-clicked', { detail: { dateStr, slot } }));
        },
      });
      // 예약된 칸에는 학생 이름을 포스트잇에 표시하고, 열려있고 예약 없는 칸만
      // 기존처럼 테두리 색으로 구분해 보여준다(클릭 리스너는 위에서 이미 처리됨)
      [...grid.children].forEach((el, i) => {
        const slot = slots[i];
        if (slot.booking) {
          const postit = el.querySelector('.postit');
          postit.innerHTML = `${escapeHtml(slot.booking.student_name)}<br>${escapeHtml(slot.booking.class_name)}`;
        } else if (slot.is_open) {
          el.style.borderColor = '#4fa27a';
        }
      });
    }

    function renderGrid(dateStr) {
      const state = window.buchimState;
      const entry = state.dates.get(dateStr);
      const container = document.getElementById('slotGrid');
      container.innerHTML = '';

      for (const group of groupByPeriod(entry.slots)) {
        const block = document.createElement('div');
        block.style.marginBottom = '16px';
        if (group.period) {
          const label = document.createElement('div');
          label.textContent = `${group.period}교시 (${group.period_range})`;
          label.style.cssText = 'color:#cfe0d3; font-size:12px; margin-bottom:6px; font-weight:600;';
          block.appendChild(label);
        }
        container.appendChild(block);
        renderSlotGroup(dateStr, block, group.slots);
      }

      renderBookingList(dateStr);
    }

    function renderBookingList(dateStr) {
      const entry = window.buchimState.dates.get(dateStr);
      let listEl = document.getElementById('bookingList');
      if (!listEl) {
        listEl = document.createElement('div');
        listEl.id = 'bookingList';
        listEl.style.marginTop = '16px';
        document.getElementById('dateEditor').appendChild(listEl);
      }
      const booked = entry.slots.filter(s => s.booking).sort((a, b) => a.start_time.localeCompare(b.start_time));
      if (booked.length === 0) {
        listEl.innerHTML = '<p style="color:#888; font-size:13px;">이 날짜엔 아직 신청이 없어요.</p>';
        return;
      }
      listEl.innerHTML = `
        <h3 style="font-size:14px; margin-bottom:8px;">신청 목록</h3>
        <table style="width:100%; border-collapse:collapse; font-size:13px;">
          <thead>
            <tr style="text-align:left; border-bottom:1px solid #ddd;">
              <th style="padding:6px 4px;">시간</th><th style="padding:6px 4px;">학생</th>
              <th style="padding:6px 4px;">반</th><th style="padding:6px 4px;">연락처</th>
              <th style="padding:6px 4px;">희망내용</th><th style="padding:6px 4px;">방식</th>
            </tr>
          </thead>
          <tbody>
            ${booked.map(s => `
              <tr style="border-bottom:1px solid #eee;">
                <td style="padding:6px 4px;">${escapeHtml(s.start_time)}</td>
                <td style="padding:6px 4px;">${escapeHtml(s.booking.student_name)}</td>
                <td style="padding:6px 4px;">${escapeHtml(s.booking.class_name)}</td>
                <td style="padding:6px 4px;">${escapeHtml(s.booking.parent_phone)}</td>
                <td style="padding:6px 4px;">${escapeHtml((s.booking.topics || []).join(', '))}</td>
                <td style="padding:6px 4px;">${s.booking.mode === 'phone' ? '전화' : '대면'}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      `;
    }

    window.addEventListener('buchim:date-selected', (e) => renderEditor(e.detail));
  </script>

  <script type="module">
    import { db } from '../shared/db.js';

    window.addEventListener('buchim:slot-clicked', (e) => {
      const { slot } = e.detail;
      if (slot.booking) {
        alert('이미 신청이 들어온 시간이라 여기서는 방식을 바꿀 수 없어요.');
        return;
      }
      const choice = prompt(
        '상담 방식을 입력해주세요 (phone / in_person / both)\n이 시간을 다시 끄려면 close 라고 입력하세요',
        slot.mode || 'both'
      );
      if (choice === 'close') {
        slot.is_open = false;
        window.dispatchEvent(new CustomEvent('buchim:date-selected', { detail: e.detail.dateStr }));
      } else if (choice && ['phone', 'in_person', 'both'].includes(choice)) {
        slot.mode = choice;
        window.dispatchEvent(new CustomEvent('buchim:date-selected', { detail: e.detail.dateStr }));
      }
    });

    document.getElementById('publishBtn').addEventListener('click', async () => {
      const state = window.buchimState;
      try {
        const code = await db.publishPage(state.pageId, state.adminCode);
        state.parentCode = code;
        const link = `${location.origin}${location.pathname.replace('/teacher/dashboard.html', '/parent/enter.html')}?code=${code}`;
        document.getElementById('publishResult').innerHTML = `
          <p>학부모 발송용 코드: <strong>${code}</strong></p>
          <p>공유 링크: <a href="${link}" target="_blank" rel="noopener noreferrer">${link}</a></p>
        `;
      } catch (err) {
        alert(err.message);
      }
    });
  </script>
</body>
</html>
