<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>붙임상담소 — 상담 신청</title>
  <link rel="stylesheet" href="../shared/chalkboard.css" />
  <style>
    body { margin:0; background:#f4f1e8; font-family:"Pretendard","Noto Sans KR",-apple-system,sans-serif; }
    .wrap { max-width:720px; margin:0 auto; padding:24px 16px 60px; }
    h1 { font-size:20px; color:#233d2e; }
    .date-block { margin-bottom:24px; }

    /* 예약 모달 */
    .modal-backdrop {
      position:fixed; inset:0; background:rgba(20,30,25,.55);
      display:flex; align-items:center; justify-content:center; padding:16px;
      z-index:10;
    }
    .modal-card {
      background:#fff; border-radius:16px; width:min(480px, 100%);
      max-height:90vh; overflow-y:auto; padding:24px; color:#222;
      box-shadow:0 12px 40px rgba(0,0,0,.25);
    }
    .modal-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
    .modal-head h2 { margin:0; font-size:18px; }
    .modal-close { background:none; border:0; font-size:22px; line-height:1; cursor:pointer; color:#888; }
    .info-banner { background:#eef2ff; border-radius:10px; padding:12px 14px; margin-bottom:20px; }
    .info-banner .title { font-weight:700; color:#3b4fd1; font-size:14px; }
    .info-banner .sub { color:#555; font-size:13px; margin-top:4px; }
    .field { margin-bottom:16px; }
    .field label { display:block; font-size:13px; font-weight:600; margin-bottom:6px; }
    .field label .req { color:#e0473e; }
    .field input, .field textarea {
      width:100%; box-sizing:border-box; padding:10px 12px; border:1px solid #ddd;
      border-radius:8px; font-size:14px; font-family:inherit;
    }
    .field textarea { resize:vertical; min-height:70px; }
    .row-2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    .pw-hint { font-size:12px; color:#777; margin-top:6px; }
    .toggle-row, .tag-row { display:flex; gap:8px; flex-wrap:wrap; }
    .toggle-btn {
      flex:1; min-width:100px; padding:12px; border-radius:10px; border:1px solid #ddd;
      background:#fafafa; cursor:pointer; font-size:14px; text-align:center;
    }
    .toggle-btn.active { border-color:#3b4fd1; background:#eef2ff; color:#3b4fd1; font-weight:700; }
    .tag-btn {
      padding:8px 14px; border-radius:999px; border:1px solid #ddd; background:#fafafa;
      cursor:pointer; font-size:13px;
    }
    .tag-btn.active { border-color:#3b4fd1; background:#3b4fd1; color:#fff; font-weight:700; }
    .submit-btn {
      width:100%; padding:14px; border:0; border-radius:10px; background:#233d2e;
      color:#fff; font-weight:700; font-size:15px; cursor:pointer; margin-top:8px;
    }
    .error { color:#c1291e; font-size:13px; margin-top:10px; min-height:16px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1 id="pageTitle">상담 신청</h1>
    <div id="dateBlocks"></div>
  </div>
  <div id="modalRoot"></div>

  <script type="module">
    import { db } from '../shared/db.js';
    import { createSlotGrid } from '../shared/chalkboard.js';

    const params = new URLSearchParams(location.search);
    const parentCode = params.get('code');
    let pageData = null;

    async function load() {
      const data = await db.getPublicSchedule(parentCode);
      pageData = data;
      document.getElementById('pageTitle').textContent = `${data.teacher_name} 선생님과의 상담 신청`;
      const container = document.getElementById('dateBlocks');
      container.innerHTML = '';

      if (data.dates.length === 0) {
        container.innerHTML = '<p>현재 열려있는 상담 가능 시간이 없어요.</p>';
        return;
      }

      for (const dateEntry of data.dates) {
        const block = document.createElement('div');
        block.className = 'date-block cb-wrap';
        block.innerHTML = `<div class="cb-title">${dateEntry.date}</div>`;
        container.appendChild(block);

        for (const group of groupByPeriod(dateEntry.slots)) {
          if (group.period) {
            const label = document.createElement('div');
            label.textContent = `${group.period}교시 (${group.period_range})`;
            label.style.cssText = 'color:#cfe0d3; font-size:12px; margin:10px 0 6px;';
            block.appendChild(label);
          }
          const grid = document.createElement('div');
          grid.className = 'cb-grid';
          block.appendChild(grid);
          createSlotGrid(grid, group.slots, {
            onEmptyClick: (slot) => {
              window.dispatchEvent(new CustomEvent('buchim:parent-slot-clicked', {
                detail: { slot, date: dateEntry.date, duration_minutes: dateEntry.duration_minutes },
              }));
            },
            onFilledClick: (slot) => {
              window.dispatchEvent(new CustomEvent('buchim:parent-slot-cancel-clicked', {
                detail: { slot, date: dateEntry.date },
              }));
            },
          });
        }
      }
    }

    // slots를 교시 단위로 묶는다("직접 설정"으로 만든 슬롯은 period가 없어 한 묶음이 된다).
    function groupByPeriod(slots) {
      const groups = [];
      const byKey = new Map();
      for (const slot of slots) {
        const key = slot.period ?? 'custom';
        if (!byKey.has(key)) {
          const group = { period: slot.period, period_range: slot.period_range, slots: [] };
          byKey.set(key, group);
          groups.push(group);
        }
        byKey.get(key).slots.push(slot);
      }
      return groups;
    }

    window.buchimGetPageData = () => pageData;

    if (!parentCode) { location.href = './enter.html'; }
    else {
      window.buchimParentCode = parentCode;
      load().catch(err => alert(err.message));
    }
  </script>

  <script type="module">
    import { db } from '../shared/db.js';
    import { stickPostit, peelPostit } from '../shared/chalkboard.js';
    import { escapeHtml } from '../shared/escape.js';

    const TOPICS = ['생활태도', '인성', '학업성취 및 성적', '진로진학', '특기적성', '교우관계'];
    const MODE_LABEL = { phone: '전화', in_person: '방문' };

    function addMinutes(hhmm, minutes) {
      const [h, m] = hhmm.split(':').map(Number);
      const total = h * 60 + m + minutes;
      const hh = String(Math.floor(total / 60) % 24).padStart(2, '0');
      const mm = String(total % 60).padStart(2, '0');
      return `${hh}:${mm}`;
    }

    window.addEventListener('buchim:parent-slot-clicked', (e) => {
      const { slot, date, duration_minutes } = e.detail;
      slot.date = date;
      slot.duration_minutes = duration_minutes;
      const page = window.buchimGetPageData();
      const endTime = addMinutes(slot.start_time.slice(0, 5), slot.duration_minutes || 20);
      const periodText = slot.period ? ` (${slot.period}교시)` : '';
      const allowedModes = slot.mode === 'both' ? ['in_person', 'phone'] : [slot.mode];

      const root = document.getElementById('modalRoot');
      root.innerHTML = `
        <div class="modal-backdrop" id="modalBackdrop">
          <div class="modal-card">
            <div class="modal-head">
              <h2>상담 예약</h2>
              <button type="button" class="modal-close" id="modalClose">×</button>
            </div>
            <div class="info-banner">
              <div class="title">${escapeHtml(page.grade || '')} ${escapeHtml(page.teacher_class || '')}</div>
              <div class="sub">${slot.date}${periodText} ${slot.start_time.slice(0, 5)} ~ ${endTime}</div>
            </div>
            <form id="bookForm">
              <div class="field">
                <label>학생 번호 <span class="req">*</span></label>
                <input name="studentNumber" required placeholder="예: 12" />
              </div>
              <div class="field">
                <label>학생 이름 <span class="req">*</span></label>
                <input name="studentName" required placeholder="예: 홍길동" />
              </div>
              <div class="row-2">
                <div class="field">
                  <label>학부모 성함 <span class="req">*</span></label>
                  <input name="parentName" required placeholder="예: 홍길동 학부모" />
                </div>
                <div class="field">
                  <label>학부모 연락처 <span class="req">*</span></label>
                  <input name="parentPhone" required placeholder="010-0000-0000" />
                </div>
              </div>
              <div class="field">
                <label>예약 비밀번호 <span class="req">*</span></label>
                <input name="password" type="password" required minlength="4" placeholder="4자리 이상 (취소할 때 필요)" />
                <p class="pw-hint">🔒 이 비밀번호로 나중에 본인이 직접 예약을 취소할 수 있어요. 꼭 기억해주세요.</p>
              </div>
              <div class="field">
                <label>상담 방법 <span class="req">*</span></label>
                <div class="toggle-row" id="modeToggle">
                  ${allowedModes.map(m => `<div class="toggle-btn" data-mode="${m}">${MODE_LABEL[m]}</div>`).join('')}
                </div>
                <p class="pw-hint">선생님이 이 시간에 가능한 방법만 선택할 수 있어요.</p>
              </div>
              <div class="field">
                <label>상담 목적 <span class="req">*</span> (중복 선택 가능)</label>
                <div class="tag-row" id="topicsRow">
                  ${TOPICS.map(t => `<div class="tag-btn" data-topic="${escapeHtml(t)}">${escapeHtml(t)}</div>`).join('')}
                </div>
              </div>
              <div class="field">
                <label>상담 내용 (선택)</label>
                <textarea name="notes" placeholder="선생님께 묻고 싶은 질문이나 미리 알려드릴 내용을 적어주세요"></textarea>
              </div>
              <button type="submit" class="submit-btn">신청하기</button>
              <div class="error" id="bookError"></div>
            </form>
          </div>
        </div>
      `;

      let chosenMode = allowedModes.length === 1 ? allowedModes[0] : null;
      const selectedTopics = new Set();

      document.getElementById('modalClose').addEventListener('click', () => { root.innerHTML = ''; });

      document.querySelectorAll('#modeToggle .toggle-btn').forEach((btn) => {
        if (btn.dataset.mode === chosenMode) btn.classList.add('active');
        btn.addEventListener('click', () => {
          chosenMode = btn.dataset.mode;
          document.querySelectorAll('#modeToggle .toggle-btn').forEach(b => b.classList.toggle('active', b === btn));
        });
      });

      document.querySelectorAll('#topicsRow .tag-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          const topic = btn.dataset.topic;
          if (selectedTopics.has(topic)) { selectedTopics.delete(topic); btn.classList.remove('active'); }
          else { selectedTopics.add(topic); btn.classList.add('active'); }
        });
      });

      document.getElementById('bookForm').addEventListener('submit', async (ev) => {
        ev.preventDefault();
        const fd = new FormData(ev.target);
        const errEl = document.getElementById('bookError');

        if (!chosenMode) { errEl.textContent = '상담 방법을 선택해주세요.'; return; }
        if (selectedTopics.size === 0) { errEl.textContent = '상담 목적을 하나 이상 선택해주세요.'; return; }

        try {
          const className = `${page.grade || ''} ${page.teacher_class || ''}`.trim();
          const cancelToken = await db.bookSlot(
            window.buchimParentCode, slot.slot_id,
            fd.get('studentNumber'), fd.get('studentName'), className,
            fd.get('parentName'), fd.get('parentPhone'), fd.get('password'),
            [...selectedTopics], fd.get('notes'), chosenMode
          );
          const slotEl = document.querySelector(`.cb-slot[data-slot-id="${slot.slot_id}"]`);
          if (slotEl) stickPostit(slotEl, `${escapeHtml(fd.get('studentNumber'))}번`);
          slot.occupied = true;
          slot.booking_ref = { student_number: fd.get('studentNumber'), cancel_token: cancelToken };

          root.querySelector('.modal-card').innerHTML = `
            <div class="modal-head"><h2>신청이 완료됐어요 🎉</h2></div>
            <p>${slot.date}${periodText} ${slot.start_time.slice(0, 5)}, ${escapeHtml(fd.get('studentName'))} 학생 상담이 접수됐어요.</p>
            <p>취소하고 싶으면 시간표에서 이 칸을 다시 눌러 예약 비밀번호를 입력하면 돼요.</p>
            <button type="button" class="submit-btn" id="modalDone">닫기</button>
          `;
          root.querySelector('#modalDone').addEventListener('click', () => { root.innerHTML = ''; });
        } catch (err) {
          if (err.message === 'ALREADY_BOOKED') {
            errEl.textContent = '방금 다른 분이 신청했어요. 새로고침해서 다른 시간을 골라주세요.';
          } else {
            errEl.textContent = err.message;
          }
        }
      });
    });

    window.addEventListener('buchim:parent-slot-cancel-clicked', (e) => {
      const { slot, date } = e.detail;
      slot.date = date;
      const ref = slot.booking_ref;
      if (!ref?.cancel_token) return;
      const periodText = slot.period ? ` (${slot.period}교시)` : '';

      const root = document.getElementById('modalRoot');
      root.innerHTML = `
        <div class="modal-backdrop" id="cancelBackdrop">
          <div class="modal-card">
            <div class="modal-head">
              <h2>예약 취소</h2>
              <button type="button" class="modal-close" id="cancelModalClose">×</button>
            </div>
            <div class="info-banner">
              <div class="title">${slot.date}${periodText} ${slot.start_time.slice(0, 5)}</div>
              <div class="sub">${escapeHtml(ref.student_number)}번 학생 예약</div>
            </div>
            <div class="field">
              <label>예약 비밀번호 <span class="req">*</span></label>
              <input name="cancelPassword" type="password" placeholder="예약할 때 정한 비밀번호" />
            </div>
            <button type="button" class="submit-btn" id="cancelSubmit">이 신청 취소하기</button>
            <div class="error" id="cancelError"></div>
          </div>
        </div>
      `;

      document.getElementById('cancelModalClose').addEventListener('click', () => { root.innerHTML = ''; });

      document.getElementById('cancelSubmit').addEventListener('click', async () => {
        const password = root.querySelector('[name="cancelPassword"]').value;
        const errEl = document.getElementById('cancelError');
        if (!password) { errEl.textContent = '예약할 때 정한 비밀번호를 입력해주세요.'; return; }
        try {
          await db.cancelBooking(ref.cancel_token, password);
          const slotEl = document.querySelector(`.cb-slot[data-slot-id="${slot.slot_id}"]`);
          if (slotEl) peelPostit(slotEl);
          slot.occupied = false;
          slot.booking_ref = null;
          root.innerHTML = '';
        } catch (err) {
          errEl.textContent = err.message;
        }
      });
    });
  </script>
</body>
</html>
