<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>붙임상담소 — 상담 신청</title>
  <link rel="stylesheet" href="../shared/chalkboard.css" />
  <style>
    body { margin:0; background:#f4f1e8; font-family:"Pretendard","Noto Sans KR",-apple-system,sans-serif; }
    .wrap { max-width:720px; margin:0 auto; padding:24px 16px 60px; }
    h1 { font-size:20px; color:#233d2e; }
    .date-block { margin-bottom:24px; }
    .date-block h2 { font-size:14px; color:#233d2e; margin:0 0 8px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1 id="pageTitle">상담 신청</h1>
    <div id="dateBlocks"></div>
    <div id="formArea"></div>
  </div>
  <script type="module">
    import { db } from '../shared/db.js';
    import { createSlotGrid } from '../shared/chalkboard.js';

    const params = new URLSearchParams(location.search);
    const parentCode = params.get('code');

    async function load() {
      const data = await db.getPublicSchedule(parentCode);
      document.getElementById('pageTitle').textContent = `${data.teacher_name} 선생님과의 상담 신청`;
      const container = document.getElementById('dateBlocks');
      container.innerHTML = '';

      if (data.dates.length === 0) {
        container.innerHTML = '<p>현재 열려있는 상담 가능 시간이 없어요.</p>';
        return;
      }

      for (const dateEntry of data.dates) {
        const block = document.createElement('div');
        block.className = 'date-block cb-wrap';
        block.innerHTML = `<div class="cb-title">${dateEntry.date}</div>`;
        container.appendChild(block);

        for (const group of groupByPeriod(dateEntry.slots)) {
          if (group.period) {
            const label = document.createElement('div');
            label.textContent = `${group.period}교시 (${group.period_range})`;
            label.style.cssText = 'color:#cfe0d3; font-size:12px; margin:10px 0 6px;';
            block.appendChild(label);
          }
          const grid = document.createElement('div');
          grid.className = 'cb-grid';
          block.appendChild(grid);
          createSlotGrid(grid, group.slots, {
            onEmptyClick: (slot) => {
              window.dispatchEvent(new CustomEvent('buchim:parent-slot-clicked', {
                detail: { ...slot, date: dateEntry.date },
              }));
            },
            onFilledClick: () => {},
          });
        }
      }
    }

    // slots를 교시 단위로 묶는다("직접 설정"으로 만든 슬롯은 period가 없어 한 묶음이 된다).
    function groupByPeriod(slots) {
      const groups = [];
      const byKey = new Map();
      for (const slot of slots) {
        const key = slot.period ?? 'custom';
        if (!byKey.has(key)) {
          const group = { period: slot.period, period_range: slot.period_range, slots: [] };
          byKey.set(key, group);
          groups.push(group);
        }
        byKey.get(key).slots.push(slot);
      }
      return groups;
    }

    if (!parentCode) { location.href = './enter.html'; }
    else {
      window.buchimParentCode = parentCode;
      load().catch(err => alert(err.message));
    }
  </script>
  <script type="module">
    import { db } from '../shared/db.js';
    import { stickPostit } from '../shared/chalkboard.js';
    import { escapeHtml } from '../shared/escape.js';

    const TOPICS = ['진로', '교우관계', '학업', '생활지도', '기타'];

    window.addEventListener('buchim:parent-slot-clicked', (e) => {
      const slot = e.detail;
      const formArea = document.getElementById('formArea');
      const showModeChoice = slot.mode === 'both';

      formArea.innerHTML = `
        <div class="cb-wrap" style="background:#fffdf7; color:#233d2e;">
          <h2 style="margin-top:0;">${slot.date} ${slot.start_time} 상담 신청</h2>
          <form id="bookForm">
            <label>학생 이름 <input name="studentName" required /></label><br/><br/>
            <label>반 <input name="className" required placeholder="예: 2학년 3반" /></label><br/><br/>
            <label>학부모 연락처 <input name="parentPhone" required placeholder="010-0000-0000" /></label><br/><br/>
            <fieldset>
              <legend>상담 희망 내용 (복수 선택 가능)</legend>
              ${TOPICS.map(t => `<label><input type="checkbox" name="topics" value="${t}" /> ${t}</label>`).join(' ')}
            </fieldset>
            ${showModeChoice ? `
              <label>상담 방식
                <select name="mode">
                  <option value="phone">전화</option>
                  <option value="in_person">대면</option>
                </select>
              </label>
            ` : `<input type="hidden" name="mode" value="${slot.mode}" />`}
            <br/><br/>
            <button type="submit">신청하기</button>
            <div class="error" id="bookError" style="color:#c1291e;"></div>
          </form>
        </div>
      `;

      document.getElementById('bookForm').addEventListener('submit', async (ev) => {
        ev.preventDefault();
        const fd = new FormData(ev.target);
        const topics = fd.getAll('topics');
        const mode = fd.get('mode');
        try {
          const cancelToken = await db.bookSlot(
            window.buchimParentCode, slot.slot_id,
            fd.get('studentName'), fd.get('className'), fd.get('parentPhone'),
            topics, mode
          );
          const slotEl = document.querySelector(`.cb-slot[data-slot-id="${slot.slot_id}"]`);
          if (slotEl) stickPostit(slotEl, `${escapeHtml(fd.get('studentName'))}<br>학부모`);

          const cancelLink = `${location.origin}${location.pathname.replace('book.html', 'cancel.html')}?token=${cancelToken}`;
          formArea.innerHTML = `
            <div class="cb-wrap" style="background:#fffdf7; color:#233d2e;">
              <h2 style="margin-top:0;">신청이 완료됐어요 🎉</h2>
              <p>${slot.date} ${slot.start_time}, ${escapeHtml(fd.get('studentName'))} 학생 상담이 접수됐어요.</p>
              <p>취소하려면 아래 링크로 들어오세요. <strong>이 화면을 캡처해두세요.</strong></p>
              <p><a href="${cancelLink}">${cancelLink}</a></p>
            </div>
          `;
        } catch (err) {
          const errEl = document.getElementById('bookError');
          if (err.message === 'ALREADY_BOOKED') {
            errEl.textContent = '방금 다른 분이 신청했어요. 새로고침해서 다른 시간을 골라주세요.';
          } else {
            errEl.textContent = err.message;
          }
        }
      });
    });
  </script>
</body>
</html>
