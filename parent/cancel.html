<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>붙임상담소 — 신청 취소</title>
  <style>
    body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
      background:#233d2e; font-family:"Pretendard","Noto Sans KR",-apple-system,sans-serif; }
    .card { background:#fffdf7; border-radius:16px; padding:32px; width:min(90vw,380px); text-align:center; }
    h1 { font-size:18px; color:#233d2e; }
    button { width:100%; padding:14px; border:0; border-radius:10px; background:#c1291e; color:#fff; font-weight:700; cursor:pointer; margin-top:16px; }
    .error { color:#c1291e; font-size:13px; margin-top:10px; }
  </style>
</head>
<body>
  <div class="card" id="card">불러오는 중...</div>
  <script type="module">
    import { db } from '../shared/db.js';

    const params = new URLSearchParams(location.search);
    const token = params.get('token');
    const card = document.getElementById('card');

    // 학생 이름 등은 학부모가 직접 입력한 값이라, innerHTML에 그대로 넣으면 안 된다.
    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, (c) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
      }[c]));
    }

    async function load() {
      if (!token) { card.innerHTML = '<p class="error">잘못된 링크예요.</p>'; return; }
      try {
        const booking = await db.getBookingByToken(token);
        card.innerHTML = `
          <h1>${escapeHtml(booking.teacher_name)} 선생님과의 상담</h1>
          <p>${booking.date} ${booking.start_time}<br/>${escapeHtml(booking.student_name)} 학생 (${escapeHtml(booking.class_name)})</p>
          <button id="cancelBtn">이 신청 취소하기</button>
        `;
        document.getElementById('cancelBtn').addEventListener('click', async () => {
          try {
            await db.cancelBooking(token);
            card.innerHTML = '<h1>취소됐어요</h1><p>다른 시간이 필요하면 다시 신청해주세요.</p>';
          } catch (err) {
            card.innerHTML += `<p class="error">${err.message}</p>`;
          }
        });
      } catch (err) {
        card.innerHTML = `<p class="error">${err.message}</p>`;
      }
    }

    load();
  </script>
</body>
</html>
