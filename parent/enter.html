<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>붙임상담소 — 상담 신청</title>
  <style>
    body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
      background:#233d2e; font-family:"Pretendard","Noto Sans KR",-apple-system,sans-serif; }
    .card { background:#fffdf7; border-radius:16px; padding:32px; width:min(90vw,380px); text-align:center; }
    h1 { font-size:18px; color:#233d2e; margin:0 0 20px; }
    input { width:100%; box-sizing:border-box; padding:12px; border:1px solid #ddd; border-radius:8px; margin-bottom:16px; font-size:16px; text-align:center; letter-spacing:2px; text-transform:uppercase; }
    button { width:100%; padding:14px; border:0; border-radius:10px; background:#ffe27a; color:#5a4a00; font-weight:700; cursor:pointer; }
    button:disabled { opacity:.5; }
    .error { color:#c1291e; font-size:13px; margin-top:10px; min-height:18px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>선생님이 알려주신 코드를 입력해주세요</h1>
    <form id="enterForm">
      <input id="codeInput" required maxlength="10" placeholder="예: A3F9K2" />
      <button type="submit" id="submitBtn">신청하러 가기</button>
      <div class="error" id="error"></div>
    </form>
  </div>
  <script type="module">
    import { db } from '../shared/db.js';

    const params = new URLSearchParams(location.search);
    const prefilled = params.get('code');
    if (prefilled) document.getElementById('codeInput').value = prefilled;

    const form = document.getElementById('enterForm');
    const errorEl = document.getElementById('error');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorEl.textContent = '';
      submitBtn.disabled = true;
      const code = document.getElementById('codeInput').value.trim().toUpperCase();
      try {
        await db.getPublicSchedule(code);
        location.href = `./book.html?code=${encodeURIComponent(code)}`;
      } catch (err) {
        errorEl.textContent = err.message;
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
